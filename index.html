<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fulltime: rate every Champions League match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#EEF1EC; --surface:#F9FBF8; --ink:#12161C; --muted:#586370; --line:#CCD3C9;
  --accent:#1C6B49; --accent-ink:#FFFFFF; --gold:#E4B10A; --star-off:#C7CEC4; --danger:#B3351F;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1217; --surface:#151C23; --ink:#E9EFEB; --muted:#94A1A9; --line:#27323B;
    --accent:#5CC596; --accent-ink:#06140D; --gold:#F2C230; --star-off:#33404A; --danger:#F07A63;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1217; --surface:#151C23; --ink:#E9EFEB; --muted:#94A1A9; --line:#27323B;
  --accent:#5CC596; --accent-ink:#06140D; --gold:#F2C230; --star-off:#33404A; --danger:#F07A63;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 16px;min-height:60px}
.logo{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:18px 10px 12px;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

main{padding:36px 0 80px}
.lede{color:var(--muted);max-width:60ch;margin-top:10px}
.pagehead{margin-bottom:26px}
.pagehead h1{font-size:clamp(40px,8vw,64px)}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tiny{font-size:13px;padding:4px 8px;border-radius:5px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.check{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* match list */
ul.list{list-style:none;margin:0;padding:0}
.mrow{border-bottom:1px solid var(--line)}
.mbtn{display:grid;grid-template-columns:104px 1fr 128px;align-items:center;gap:8px 12px;width:100%;background:none;border:0;padding:16px 4px;text-align:left}
.mbtn:hover{background:var(--surface)}
.mdate{font-size:13px;color:var(--muted);line-height:1.35}
.mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.th{text-align:right;font-weight:500}
.ta{text-align:left;font-weight:500}
.sc{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.04em;min-width:76px;text-align:center}
.win{font-weight:700}
.mmine{justify-self:end;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.mmine .logit{border:1px solid var(--line);border-radius:5px;padding:3px 10px;color:var(--ink)}
@media (max-width:600px){
  .mbtn{grid-template-columns:1fr auto;grid-template-areas:"d m" "t t"}
  .mdate{grid-area:d}.mmine{grid-area:m}.mteams{grid-area:t}
  .sc{font-size:30px;min-width:64px}
}

/* stars */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.st{position:relative;display:inline-block;width:28px;height:28px;--f:0}
.st::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold) calc(var(--f)*100%),var(--star-off) calc(var(--f)*100%));clip-path:polygon(50% 2%,62% 36%,98% 36%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 36%,38% 36%)}
.st.sm{width:15px;height:15px}
.half{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0}
.half.l{left:0}.half.r{right:0}
.rate{display:flex;align-items:center;gap:14px}
.rate .stars{gap:4px}
.rate .st{width:36px;height:36px}
.rv{color:var(--muted);min-width:70px}

/* forms */
label.f{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addp{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:26px}
.addp label.f{margin-top:0}
@media (max-width:600px){.addp{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
.note{color:var(--muted);font-size:14px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,10,14,.6)}
.dlg{padding:24px 24px 20px}
.dlg h2{font-size:36px}
.dlg .sub{color:var(--muted);margin-top:4px}
.dlg .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.dlg .actions .spacer{flex:1}
.takes{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.takes h3{font-size:22px;margin-bottom:8px}
.take{padding:8px 0;border-bottom:1px solid var(--line)}
.take:last-child{border-bottom:0}
.take b{font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;text-align:left}
.prow:hover{background:var(--surface)}
.pname{font-weight:700;font-size:17px}
.pteam{color:var(--muted);font-size:14px}
.pnote{grid-column:1/-1;color:var(--muted);font-size:14px}

/* profile */
.phead h1{font-size:clamp(44px,9vw,72px)}
.phead p{color:var(--muted);margin-top:10px}
.sect{margin-top:46px}
.sect>h2{font-size:30px;margin-bottom:16px}
.tops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.tops{grid-template-columns:1fr}}
.stub{position:relative;display:grid;grid-template-columns:1fr 104px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:160px}
.stub::before,.stub::after{content:"";position:absolute;right:95px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-10px;clip-path:inset(50% 0 0 0)}
.stub::after{bottom:-10px;clip-path:inset(0 0 50% 0)}
.stub-main{padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stub-meta{font-size:13px;color:var(--muted)}
.stub-line{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.stub-line b{font-family:var(--display);font-size:26px;line-height:1}
.stub-line.w{font-weight:700}
.stub-rev{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.stub-ctl{margin-top:auto;display:flex;gap:6px;padding-top:6px}
.stub-side{border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;text-align:center}
.stub-side .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.stub-side .stars{gap:1px;flex-wrap:wrap;justify-content:center;max-width:84px}
.stub-side .mode{font-size:12px;color:var(--muted);line-height:1.25}
.empty-slot{display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed var(--line);border-radius:10px;color:var(--muted);background:none;width:100%}
ol.ranks{list-style:none;margin:0;padding:0}
.rank{display:grid;grid-template-columns:48px 1fr auto;gap:2px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rk{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--accent);grid-row:span 2}
.rank .pnote{grid-column:2/-1}
.rank .ctl{display:flex;gap:6px}
.diary-row{padding:14px 0;border-bottom:1px solid var(--line)}
.diary-row .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.diary-row .t b{font-weight:700}
.diary-row p{color:var(--muted);margin-top:4px;max-width:70ch}

/* people */
.panel{border-left:4px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:32px}
.panel h2{font-size:28px;margin-bottom:6px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.frow b{font-size:17px}
.status{margin-top:8px;font-size:14px;color:var(--muted)}
.status.err{color:var(--danger)}
.empty{padding:34px 0;color:var(--muted)}

/* accounts */
.acct{display:flex;align-items:center;gap:10px;font-size:14px}
.acct .who{background:none;border:0;padding:0;font-weight:700;color:var(--ink)}
@media (max-width:640px){
  header.top .wrap{padding-top:8px}
  .acct{order:1}
  nav{order:2;width:100%;overflow-x:auto}
}
a.btn{display:inline-block;text-decoration:none}
.btn.wide{width:100%}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:18px 0 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.formerr{margin-top:12px;font-size:14px;color:var(--danger)}
.formerr:empty{display:none}
.formerr.ok{color:var(--accent)}
.sharelink{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.sharelink a{color:var(--accent);font-weight:700;word-break:break-all}
.panel .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:calc(100vw - 32px);font-size:15px}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .2s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo">Fulltime</div>
    <nav aria-label="Main">
      <button data-act="tab" data-tab="matches">Matches</button>
      <button data-act="tab" data-tab="players">Players</button>
      <button data-act="tab" data-tab="profile">Profile</button>
      <button data-act="tab" data-tab="people">People</button>
    </nav>
    <div class="acct" id="acct"></div>
  </div>
</header>
<main><div class="wrap" id="main"></div></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- data: results through matchday 3 of 2026/27, appended by scripts/update_matches.py ---------- */
var TEAMS=['AEK Athens','Arsenal','Aston Villa','Atlético Madrid','Barcelona','Bayern München','Bodø/Glimt','Borussia Dortmund','Club Brugge','Como','Fenerbahçe','Feyenoord','Galatasaray','Inter','LASK','Lens','Lille','Liverpool','Manchester City','Manchester United','Napoli','Paris Saint-Germain','Porto','PSV Eindhoven','RB Leipzig','Real Betis','Real Madrid','Roma','Sabah','Shakhtar Donetsk','Slavia Praha','Slovan Bratislava','Sporting CP','Stuttgart','Villarreal','Viking'];
var RAW=[
 [1,'2026-09-08','Aston Villa',3,'Club Brugge',2],
 [1,'2026-09-08','AEK Athens',1,'LASK',0],
 [1,'2026-09-08','Real Madrid',2,'Inter',1],
 [1,'2026-09-08','Borussia Dortmund',3,'Villarreal',2],
 [1,'2026-09-08','Manchester City',2,'Porto',0],
 [1,'2026-09-08','Real Betis',3,'Lille',2],
 [1,'2026-09-09','Barcelona',5,'Feyenoord',1],
 [1,'2026-09-09','Stuttgart',3,'Viking',1],
 [1,'2026-09-09','Paris Saint-Germain',6,'Slovan Bratislava',1],
 [1,'2026-09-09','Liverpool',2,'Atlético Madrid',1],
 [1,'2026-09-09','Sporting CP',3,'Galatasaray',1],
 [1,'2026-09-09','Arsenal',1,'Napoli',0],
 [1,'2026-09-10','PSV Eindhoven',1,'Shakhtar Donetsk',1],
 [1,'2026-09-10','Fenerbahçe',1,'Roma',1],
 [1,'2026-09-10','Bayern München',5,'Bodø/Glimt',0],
 [1,'2026-09-10','Manchester United',4,'Sabah',0],
 [1,'2026-09-10','Slavia Praha',2,'Lens',3],
 [1,'2026-09-10','Como',4,'RB Leipzig',1],
 [2,'2026-10-13','Lens',0,'Sporting CP',2],
 [2,'2026-10-13','Sabah',2,'Slavia Praha',0],
 [2,'2026-10-13','Arsenal',3,'Lille',0],
 [2,'2026-10-13','Atlético Madrid',2,'Manchester United',0],
 [2,'2026-10-13','Inter',3,'Club Brugge',4],
 [2,'2026-10-13','Galatasaray',1,'Barcelona',4],
 [2,'2026-10-13','RB Leipzig',1,'PSV Eindhoven',0],
 [2,'2026-10-13','Viking',3,'Bayern München',3],
 [2,'2026-10-13','Villarreal',3,'Napoli',1],
 [2,'2026-10-14','Feyenoord',3,'Como',2],
 [2,'2026-10-14','LASK',3,'Liverpool',6],
 [2,'2026-10-14','Roma',3,'Real Madrid',4],
 [2,'2026-10-14','Aston Villa',6,'Fenerbahçe',0],
 [2,'2026-10-14','Shakhtar Donetsk',3,'AEK Athens',1],
 [2,'2026-10-14','Bodø/Glimt',1,'Borussia Dortmund',0],
 [2,'2026-10-14','Manchester City',2,'Paris Saint-Germain',4],
 [2,'2026-10-14','Real Betis',3,'Porto',2],
 [2,'2026-10-14','Slovan Bratislava',0,'Stuttgart',3],
 [3,'2026-10-20','Sabah',1,'Borussia Dortmund',2],
 [3,'2026-10-20','Fenerbahçe',2,'Slavia Praha',2],
 [3,'2026-10-20','Manchester City',5,'AEK Athens',1],
 [3,'2026-10-20','Stuttgart',1,'Atlético Madrid',1],
 [3,'2026-10-20','Liverpool',4,'Villarreal',3],
 [3,'2026-10-20','Roma',4,'Slovan Bratislava',0],
 [3,'2026-10-20','Porto',0,'PSV Eindhoven',1],
 [3,'2026-10-20','Napoli',4,'Bodø/Glimt',3],
 [3,'2026-10-20','Paris Saint-Germain',4,'Barcelona',2],
 [3,'2026-10-21','Como',4,'Manchester United',1],
 [3,'2026-10-21','Lille',2,'Galatasaray',4],
 [3,'2026-10-21','Real Madrid',4,'RB Leipzig',1],
 [3,'2026-10-21','Inter',1,'Shakhtar Donetsk',0],
 [3,'2026-10-21','Bayern München',2,'Arsenal',2],
 [3,'2026-10-21','Club Brugge',3,'Lens',0],
 [3,'2026-10-21','Aston Villa',3,'Viking',1],
 [3,'2026-10-21','Sporting CP',2,'LASK',3],
 [3,'2026-10-21','Real Betis',1,'Feyenoord',0]
];
var BASE=RAW.map(function(r,i){return{id:'m'+(i+1),md:r[0],date:r[1],home:r[2],hs:r[3],away:r[4],as:r[5]}});
var MODES={live:'Watched live',replay:'Watched the replay',attended:'Was at the match',highlights:'Highlights only'};
var KEY='fulltime.v1';

/* ---------- state ---------- */
function blank(){return{logs:{},players:{},favM:[],favP:[],custom:[]}}
function str(v,n){return typeof v==='string'?v.slice(0,n):''}
function half(v){v=Number(v);return isFinite(v)?Math.max(0,Math.min(5,Math.round(v*2)/2)):0}
function int(v){v=parseInt(v,10);return isFinite(v)?Math.max(0,Math.min(99,v)):0}
function clean(o){
  var out=blank();
  if(!o||typeof o!=='object')return out;
  if(o.logs&&typeof o.logs==='object'){
    var n=0;
    Object.keys(o.logs).forEach(function(k){
      if(n++>2000)return;
      var l=o.logs[k]||{};
      out.logs[str(k,40)]={rating:half(l.rating),mode:MODES[l.mode]?l.mode:'live',review:str(l.review,400),ts:Number(l.ts)||0};
    });
  }
  if(o.players&&typeof o.players==='object'){
    var m=0;
    Object.keys(o.players).forEach(function(k){
      if(m++>1000)return;
      var p=o.players[k]||{};
      out.players[str(k,100)]={id:str(k,100),name:str(p.name,60),team:str(p.team,40),rating:half(p.rating),note:str(p.note,200)};
    });
  }
  if(Array.isArray(o.custom)){
    out.custom=o.custom.slice(0,200).map(function(c){
      c=c||{};
      return{id:str(c.id,40),md:Math.max(1,Math.min(9,int(c.md)||1)),date:/^\d{4}-\d\d-\d\d$/.test(c.date)?c.date:'2026-01-01',home:str(c.home,40),hs:int(c.hs),away:str(c.away,40),as:int(c.as)};
    });
  }
  if(Array.isArray(o.favM))out.favM=o.favM.slice(0,4).map(function(x){return str(x,40)});
  if(Array.isArray(o.favP))out.favP=o.favP.slice(0,4).map(function(x){return str(x,100)});
  return out;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return clean(JSON.parse(r))}catch(e){}
  return blank();
}
var S=load();
var V={tab:'matches',filter:'all',logged:false,user:null};
var D=null;
var SB=null,USER=null,ME=null,BOOT=true; // Supabase client, signed-in user, their profile row, waiting for first auth event
var PEOPLE={q:'',list:null,err:''};
var PUB={name:null,data:null,err:''};

/* ---------- storage: this browser when signed out, Supabase when signed in ---------- */
function saveLocal(){if(!USER)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function remote(q){
  q.then(function(r){if(r.error){console.error(r.error);toast('Couldn’t save that. Check your connection and try again.')}});
}
function iso(ts){return new Date(ts||Date.now()).toISOString()}
function logRow(id,l){return{user_id:ME.id,match_id:id,rating:l.rating,mode:l.mode,review:l.review,logged_at:iso(l.ts),updated_at:iso()}}
function playerRow(p){return{user_id:ME.id,player_id:p.id,name:p.name,team:p.team,rating:p.rating,note:p.note}}
function customRow(c){return{user_id:ME.id,id:c.id,md:c.md,match_date:c.date,home:c.home,home_goals:c.hs,away:c.away,away_goals:c.as}}
function putLog(id){saveLocal();if(ME)remote(SB.from('match_logs').upsert(logRow(id,S.logs[id])))}
function delLog(id){saveLocal();if(ME)remote(SB.from('match_logs').delete().eq('user_id',ME.id).eq('match_id',id))}
function putPlayer(id){saveLocal();if(ME)remote(SB.from('player_ratings').upsert(playerRow(S.players[id])))}
function delPlayer(id){saveLocal();if(ME)remote(SB.from('player_ratings').delete().eq('user_id',ME.id).eq('player_id',id))}
function putCustom(c){saveLocal();if(ME)remote(SB.from('custom_matches').upsert(customRow(c)))}
function delCustom(id){saveLocal();if(ME)remote(SB.from('custom_matches').delete().eq('user_id',ME.id).eq('id',id))}
function putFavs(){saveLocal();if(ME)remote(SB.from('profiles').update({fav_matches:S.favM,fav_players:S.favP}).eq('id',ME.id))}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(sel,root){return(root||document).querySelector(sel)}
function allMatches(d){return BASE.concat(d.custom)}
function matchById(id,d){var a=allMatches(d);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function mdLabel(md){return md===9?'Knockouts':'Matchday '+md}
function fmtDate(d){try{return new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}catch(e){return d}}
function fill(i,v){return Math.max(0,Math.min(1,v-(i-1)))}
function starsHTML(v){
  var h='<span class="stars" role="img" aria-label="'+v+' out of 5 stars">';
  for(var i=1;i<=5;i++)h+='<span class="st sm" style="--f:'+fill(i,v)+'"></span>';
  return h+'</span>';
}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function plural(n,w){return n+' '+w+(n===1?'':/(s|x|z|ch|sh)$/.test(w)?'es':'s')}
var toastTimer;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3200);
}
function teamOptions(sel){
  return '<option value="">Choose a club</option>'+TEAMS.map(function(t){return'<option'+(t===sel?' selected':'')+'>'+esc(t)+'</option>'}).join('');
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('nav [data-tab]').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===V.tab?'page':'false')});
  renderAcct();
  var m=$('#main');
  m.innerHTML=V.tab==='matches'?matchesView():V.tab==='players'?playersView():V.tab==='profile'?profileView():peopleView();
}
function renderAcct(){
  var a=$('#acct');
  if(!SB||BOOT){a.innerHTML='';return}
  if(!USER){a.innerHTML='<button class="btn tiny" data-act="sign-in">Sign in</button>';return}
  a.innerHTML=(ME?'<button class="who" data-act="tab" data-tab="profile">@'+esc(ME.username)+'</button>':'')+'<button class="btn ghost tiny" data-act="sign-out">Sign out</button>';
}

function matchesView(){
  var all=allMatches(S);
  var mds=[];all.forEach(function(m){if(mds.indexOf(m.md)<0)mds.push(m.md)});
  mds.sort(function(a,b){return a-b});
  var list=all.slice();
  if(V.filter!=='all')list=list.filter(function(m){return String(m.md)===V.filter});
  if(V.logged)list=list.filter(function(m){return S.logs[m.id]});
  list.sort(function(a,b){return b.date.localeCompare(a.date)||a.id.localeCompare(b.id)});
  var h='<div class="pagehead"><h1>Champions League 2026/27</h1><p class="lede">Log a match, give it stars, say what you thought. Results here run through matchday 3. If something newer has been played, add it yourself.</p></div>';
  h+='<div class="toolbar"><div class="chips" role="group" aria-label="Filter by matchday"><button class="chip" data-act="filter" data-f="all" aria-pressed="'+(V.filter==='all')+'">All</button>';
  mds.forEach(function(md){h+='<button class="chip" data-act="filter" data-f="'+md+'" aria-pressed="'+(V.filter===String(md))+'">'+(md===9?'Knockouts':'MD '+md)+'</button>'});
  h+='</div><span class="spacer"></span><label class="check"><input type="checkbox" data-act="toggle-logged"'+(V.logged?' checked':'')+'> Only matches I’ve logged</label><button class="btn ghost" data-act="add-match-open">Add a match</button></div>';
  if(!list.length){
    h+='<p class="empty">'+(V.logged?'You haven’t logged a match here yet. Switch off the filter and pick one.':'No matches to show.')+'</p>';
  }else{
    h+='<ul class="list">';
    list.forEach(function(m){
      var l=S.logs[m.id];
      var hw=m.hs>m.as,aw=m.as>m.hs;
      h+='<li class="mrow"><button class="mbtn" data-act="open-match" data-id="'+esc(m.id)+'" aria-label="'+esc(m.home+' '+m.hs+' '+m.as+' '+m.away)+'">'
        +'<span class="mdate">'+esc(fmtDate(m.date))+'<br>'+esc(mdLabel(m.md))+'</span>'
        +'<span class="mteams"><span class="th'+(hw?' win':'')+'">'+esc(m.home)+'</span><span class="sc">'+m.hs+'–'+m.as+'</span><span class="ta'+(aw?' win':'')+'">'+esc(m.away)+'</span></span>'
        +'<span class="mmine">'+(l?(l.rating?starsHTML(l.rating):'<span>Reviewed</span>'):'<span class="logit">Log</span>')+'</span></button></li>';
    });
    h+='</ul>';
  }
  return h;
}

function playersView(){
  var ps=Object.keys(S.players).map(function(k){return S.players[k]});
  ps.sort(function(a,b){return b.rating-a.rating||a.name.localeCompare(b.name)});
  var h='<div class="pagehead"><h1>Players</h1><p class="lede">Add the players you want to rate this season, then give each one your own score. It’s your opinion, so there’s no wrong answer.</p></div>';
  h+='<div class="addp"><div><label class="f" for="pn">Player name</label><input type="text" id="pn" maxlength="60" autocomplete="off"></div>'
    +'<div><label class="f" for="pt">Club</label><select id="pt">'+teamOptions('')+'</select></div>'
    +'<button class="btn" data-act="add-player">Add player</button></div>';
  if(!ps.length){h+='<p class="empty">No players yet. Type a name above and pick their club.</p>'}
  else{
    ps.forEach(function(p){
      h+='<button class="prow" data-act="open-player" data-id="'+esc(p.id)+'"><span><span class="pname">'+esc(p.name)+'</span><br><span class="pteam">'+esc(p.team)+'</span></span><span>'+(p.rating?starsHTML(p.rating):'<span class="note">Not rated</span>')+'</span>'+(p.note?'<span class="pnote">'+esc(p.note)+'</span>':'')+'</button>';
    });
  }
  return h;
}

function stubHTML(m,l,ctl,idx,last){
  var hw=m.hs>m.as,aw=m.as>m.hs;
  var h='<article class="stub"><div class="stub-main"><div class="stub-meta">'+esc(mdLabel(m.md))+', '+esc(fmtDate(m.date))+'</div>'
    +'<div class="stub-line'+(hw?' w':'')+'"><span>'+esc(m.home)+'</span><b>'+m.hs+'</b></div>'
    +'<div class="stub-line'+(aw?' w':'')+'"><span>'+esc(m.away)+'</span><b>'+m.as+'</b></div>';
  if(l&&l.review)h+='<p class="stub-rev">'+esc(l.review)+'</p>';
  if(ctl){
    h+='<div class="stub-ctl">';
    if(idx>0)h+='<button class="btn ghost tiny" data-act="favm-left" data-id="'+esc(m.id)+'">Move earlier</button>';
    h+='<button class="btn danger tiny" data-act="favm-del" data-id="'+esc(m.id)+'">Remove</button></div>';
  }
  h+='</div><div class="stub-side">';
  if(l&&l.rating)h+='<span class="big">'+l.rating.toFixed(1)+'</span>'+starsHTML(l.rating);
  else h+='<span class="mode">Logged</span>';
  if(l)h+='<span class="mode">'+esc(MODES[l.mode]||'')+'</span>';
  return h+'</div></article>';
}

function profileHTML(d,isMe,name,extra){
  var byId={};allMatches(d).forEach(function(m){byId[m.id]=m});
  var logs=Object.keys(d.logs).filter(function(id){return byId[id]}).map(function(id){return[id,d.logs[id]]});
  var rated=logs.filter(function(x){return x[1].rating>0});
  var avg=rated.length?rated.reduce(function(s,x){return s+x[1].rating},0)/rated.length:0;
  var players=Object.keys(d.players).map(function(k){return d.players[k]});
  var h='<div class="phead"><h1>'+esc(name)+'</h1><p>'+plural(logs.length,'match')+' logged'+(rated.length?', averaging '+avg.toFixed(1)+' stars':'')+'. '+plural(players.length,'player')+' rated.</p>'+(extra||'')+'</div>';

  h+='<section class="sect"><h2>Top four matches</h2><div class="tops">';
  var fm=d.favM.filter(function(id){return byId[id]}).slice(0,4);
  fm.forEach(function(id,i){h+=stubHTML(byId[id],d.logs[id],isMe,i)});
  if(isMe){for(var i=fm.length;i<4;i++)h+='<button class="empty-slot" data-act="go-matches">Pick a favourite match</button>'}
  else if(!fm.length)h+='<p class="empty">No top matches picked yet.</p>';
  h+='</div></section>';

  h+='<section class="sect"><h2>Top four players</h2>';
  var fp=d.favP.filter(function(id){return d.players[id]}).slice(0,4);
  if(fp.length){
    h+='<ol class="ranks">';
    fp.forEach(function(id,i){
      var p=d.players[id];
      h+='<li class="rank"><span class="rk" aria-hidden="true">'+(i+1)+'</span><span><span class="pname">'+esc(p.name)+'</span> <span class="pteam">'+esc(p.team)+'</span></span><span class="ctl">'+(p.rating?starsHTML(p.rating):'')
        +(isMe?(i>0?'<button class="btn ghost tiny" data-act="favp-up" data-id="'+esc(id)+'" aria-label="Move '+esc(p.name)+' up">Up</button>':'')+'<button class="btn danger tiny" data-act="favp-del" data-id="'+esc(id)+'">Remove</button>':'')
        +'</span>'+(p.note?'<span class="pnote">'+esc(p.note)+'</span>':'')+'</li>';
    });
    h+='</ol>';
  }else{
    h+=isMe?'<p class="empty">Rate a player, then add them to your top four from the Players tab.</p>':'<p class="empty">No top players picked yet.</p>';
  }
  h+='</section>';

  h+='<section class="sect"><h2>Diary</h2>';
  logs.sort(function(a,b){return(b[1].ts||0)-(a[1].ts||0)});
  if(!logs.length)h+='<p class="empty">'+(isMe?'Nothing logged yet. Open a match and give it some stars.':'Nothing logged yet.')+'</p>';
  logs.slice(0,25).forEach(function(x){
    var m=byId[x[0]],l=x[1];
    h+='<div class="diary-row"><div class="t"><b>'+esc(m.home)+' '+m.hs+'–'+m.as+' '+esc(m.away)+'</b>'+(l.rating?starsHTML(l.rating):'')+'<span class="note">'+esc(MODES[l.mode]||'')+'</span></div>'+(l.review?'<p>'+esc(l.review)+'</p>':'')+'</div>';
  });
  h+='</section>';
  return h;
}
function profileUrl(u){return location.origin+location.pathname+'#/u/'+u}
function importPanel(){
  var x=importable();
  if(!x)return '';
  var parts=[];
  if(x.logs)parts.push(plural(x.logs,'match'));
  if(x.players)parts.push(plural(x.players,'player'));
  return '<section class="panel"><h2>Bring over your ratings</h2><p>Before you signed in, you rated '+parts.join(' and ')+' in this browser. Add them to your account? Anything already in your account stays as it is.</p>'
    +'<div class="btns"><button class="btn" data-act="import">Import them</button><button class="btn ghost" data-act="import-skip">Not now</button></div></section>';
}
function profileView(){
  if(ME){
    var link='<p class="sharelink">Your public profile: <a href="#/u/'+esc(ME.username)+'">'+esc(profileUrl(ME.username))+'</a><button class="btn ghost tiny" data-act="copy-link">Copy link</button></p>';
    return importPanel()+profileHTML(S,true,'@'+ME.username,link);

  if(SB&&!BOOT&&!USER)h='<section class="panel"><h2>Keep your ratings</h2><p>Right now your ratings are saved only in this browser. Sign in to keep them, use them on any device and share your profile.</p><div class="btns"><button class="btn" data-act="sign-in">Sign in or create an account</button></div></section>';

}

  if(V.user)return publicView();

  if(!SB)return h+'<p class="empty">Accounts aren’t set up for this copy of Fulltime yet.</p>';

function peopleListHTML(){

  if(PEOPLE.list===null)return '<p class="empty">Loading…</p>';

  return PEOPLE.list.map(function(p){
    var u=esc(p.username);
    return '<div class="frow"><b>@'+u+(ME&&ME.username===p.username?' <span class="note">(you)</span>':'')+'</b><a class="btn ghost" href="#/u/'+u+'">View profile</a></div>';
  }).join('');
}
function publicView(){
  var h='<p style="margin-bottom:18px"><a class="link" href="#/people">All people</a></p>';
  if(PUB.err)return h+'<p class="empty">'+esc(PUB.err)+'</p>';
  if(!PUB.data)return h+'<p class="empty">Loading…</p>';

/* ---------- dialogs ---------- */
function rateHTML(){
  var h='<div class="rate"><div class="stars" role="group" aria-label="Your rating">';
  for(var i=1;i<=5;i++){
    h+='<span class="st" style="--f:'+fill(i,D.rating)+'"><button type="button" class="half l" data-act="setr" data-v="'+(i-0.5)+'" aria-label="'+(i-0.5)+' stars"></button><button type="button" class="half r" data-act="setr" data-v="'+i+'" aria-label="'+i+' stars"></button></span>';
  }
  return h+'</div><span class="rv" id="rv">'+(D.rating?D.rating.toFixed(1)+' stars':'Not rated')+'</span><button type="button" class="link" data-act="clearr">Clear</button></div>';
}
function paintRate(){
  $('#dlg').querySelectorAll('.rate .st').forEach(function(s,i){s.style.setProperty('--f',fill(i+1,D.rating))});
  $('#rv').textContent=D.rating?D.rating.toFixed(1)+' stars':'Not rated';
}
function openDlg(html){var d=$('#dlg');d.innerHTML='<div class="dlg">'+html+'</div>';if(!d.open)d.showModal()}
function closeDlg(){var d=$('#dlg');if(d.open)d.close();D=null}

function openMatch(id){
  var m=matchById(id,S);
  if(!m){toast('That match isn’t in your list.');return}
  var l=S.logs[id]||{};
  var isFav=S.favM.indexOf(id)>=0;
  D={type:'match',id:id,rating:l.rating||0};
  var full=!isFav&&S.favM.length>=4;
  var h='<h2>'+esc(m.home)+' '+m.hs+'–'+m.as+' '+esc(m.away)+'</h2><p class="sub">'+esc(mdLabel(m.md))+', '+esc(fmtDate(m.date))+'</p>'
    +'<label class="f">Your rating</label>'+rateHTML()
    +'<label class="f" for="f-mode">How did you see it?</label><select id="f-mode">'+Object.keys(MODES).map(function(k){return'<option value="'+k+'"'+(l.mode===k?' selected':'')+'>'+MODES[k]+'</option>'}).join('')+'</select>'
    +'<label class="f" for="f-review">Your take</label><textarea id="f-review" maxlength="400" placeholder="What made it great, or not?">'+esc(l.review||'')+'</textarea>'
    +'<label class="check" style="margin-top:14px"><input type="checkbox" id="f-fav"'+(isFav?' checked':'')+(full?' disabled':'')+'> Show in my top four matches</label>'
    +(full?'<p class="note">Your top four is full. Remove one from your profile first.</p>':'')
    +'<div class="actions"><button class="btn" data-act="save-match">Save</button><button class="btn ghost" data-act="close">Cancel</button><span class="spacer"></span>'
    +(S.logs[id]?'<button class="btn danger" data-act="del-log">Remove from diary</button>':'')
    +(id.charAt(0)==='c'?'<button class="btn danger" data-act="del-match">Delete match</button>':'')+'</div>';
  openDlg(h);
}

function openPlayer(id){
  var p=S.players[id];if(!p)return;
  var isFav=S.favP.indexOf(id)>=0;
  var full=!isFav&&S.favP.length>=4;
  D={type:'player',id:id,rating:p.rating||0};
  openDlg('<h2>'+esc(p.name)+'</h2><p class="sub">'+esc(p.team)+'</p>'
    +'<label class="f">Your rating for this season</label>'+rateHTML()
    +'<label class="f" for="f-note">A line about them</label><textarea id="f-note" maxlength="200" placeholder="Why do they rate where they do?">'+esc(p.note||'')+'</textarea>'
    +'<label class="check" style="margin-top:14px"><input type="checkbox" id="f-fav"'+(isFav?' checked':'')+(full?' disabled':'')+'> Show in my top four players</label>'
    +(full?'<p class="note">Your top four is full. Remove one from your profile first.</p>':'')
    +'<div class="actions"><button class="btn" data-act="save-player">Save</button><button class="btn ghost" data-act="close">Cancel</button><span class="spacer"></span><button class="btn danger" data-act="del-player">Remove player</button></div>');
}

function openAddMatch(){
  D={type:'add'};
  var mdOpts='';for(var i=1;i<=8;i++)mdOpts+='<option value="'+i+'">Matchday '+i+'</option>';
  mdOpts+='<option value="9">Knockouts</option>';
  openDlg('<h2>Add a match</h2><p class="sub">Use this for results that aren’t listed yet.</p>'
    +'<div class="row2"><div><label class="f" for="a-md">Round</label><select id="a-md">'+mdOpts+'</select></div><div><label class="f" for="a-date">Date</label><input type="date" id="a-date"></div></div>'
    +'<div class="row2"><div><label class="f" for="a-home">Home</label><select id="a-home">'+teamOptions('')+'</select></div><div><label class="f" for="a-hs">Home goals</label><input type="number" id="a-hs" min="0" max="99" value="0"></div></div>'
    +'<div class="row2"><div><label class="f" for="a-away">Away</label><select id="a-away">'+teamOptions('')+'</select></div><div><label class="f" for="a-as">Away goals</label><input type="number" id="a-as" min="0" max="99" value="0"></div></div>'
    +'<p class="note" id="a-err" style="margin-top:12px;color:var(--danger)"></p>'
    +'<div class="actions"><button class="btn" data-act="add-match-save">Add match</button><button class="btn ghost" data-act="close">Cancel</button></div>');
}

/* ---------- actions ---------- */
function move(arr,id,dir){var i=arr.indexOf(id);var j=i+dir;if(i<0||j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
function clearRoute(){if(location.hash)history.replaceState(null,'',location.pathname+location.search);V.user=null}

document.addEventListener('click',function(e){
  var dlg=$('#dlg');
  if(e.target===dlg){if(!D||D.type!=='username')closeDlg();return}
  var t=e.target.closest('[data-act]');
  if(!t)return;
  var act=t.dataset.act,id=t.dataset.id;
  switch(act){
    case 'tab':V.tab=t.dataset.tab;clearRoute();if(V.tab==='people'&&PEOPLE.list===null)loadPeople();render();window.scrollTo(0,0);break;
    case 'filter':V.filter=t.dataset.f;render();break;
    case 'open-match':openMatch(id);break;
    case 'open-player':openPlayer(id);break;
    case 'add-match-open':openAddMatch();break;
    case 'go-matches':V.tab='matches';render();window.scrollTo(0,0);break;
    case 'close':closeDlg();break;
    case 'setr':if(D){D.rating=parseFloat(t.dataset.v);paintRate()}break;
    case 'clearr':if(D){D.rating=0;paintRate()}break;
    case 'save-match':{
      var rating=D.rating,review=$('#f-review').value.trim().slice(0,400),mode=$('#f-mode').value,fav=$('#f-fav').checked;
      var mid=D.id,favs=S.favM.join();
      if(!rating&&!review){delete S.logs[mid];S.favM=S.favM.filter(function(x){return x!==mid});delLog(mid)}
      else{
        var prev=S.logs[mid];
        S.logs[mid]={rating:rating,mode:mode,review:review,ts:prev?prev.ts:Date.now()};
        var has=S.favM.indexOf(mid)>=0;
        if(fav&&!has&&S.favM.length<4)S.favM.push(mid);
        if(!fav&&has)S.favM=S.favM.filter(function(x){return x!==mid});
        putLog(mid);
      }
      if(S.favM.join()!==favs)putFavs();
      closeDlg();render();toast('Saved to your diary');
      break;}
    case 'del-log':{
      var d1=D.id,f1=S.favM.join();delete S.logs[d1];S.favM=S.favM.filter(function(x){return x!==d1});
      delLog(d1);if(S.favM.join()!==f1)putFavs();
      closeDlg();render();toast('Removed from your diary');break;}
    case 'del-match':{
      var d2=D.id,f2=S.favM.join();
      S.custom=S.custom.filter(function(c){return c.id!==d2});
      delCustom(d2);
      if(S.logs[d2]){delete S.logs[d2];delLog(d2)}
      S.favM=S.favM.filter(function(x){return x!==d2});if(S.favM.join()!==f2)putFavs();
      closeDlg();render();toast('Match deleted');break;}
    case 'add-match-save':{
      var home=$('#a-home').value,away=$('#a-away').value,date=$('#a-date').value;
      var err=$('#a-err');
      if(!home||!away){err.textContent='Choose both clubs.';break}
      if(home===away){err.textContent='A club can’t play itself. Choose two different clubs.';break}
      if(!date){err.textContent='Pick the match date.';break}
      var c={id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),md:parseInt($('#a-md').value,10),date:date,home:home,hs:int($('#a-hs').value),away:away,as:int($('#a-as').value)};
      S.custom.push(c);putCustom(c);
      closeDlg();render();toast('Match added');
      break;}
    case 'add-player':{
      var name=$('#pn').value.trim().slice(0,60),team=$('#pt').value;
      if(!name){toast('Type the player’s name first.');$('#pn').focus();break}
      if(!team){toast('Choose the player’s club.');$('#pt').focus();break}
      var pid=slug(name)+'|'+slug(team);
      if(S.players[pid]){toast(name+' is already in your list.');break}
      S.players[pid]={id:pid,name:name,team:team,rating:0,note:''};
      putPlayer(pid);render();toast(name+' added. Tap them to give a rating.');
      break;}
    case 'save-player':{
      var p=S.players[D.id];if(!p)break;
      var f3=S.favP.join();
      p.rating=D.rating;p.note=$('#f-note').value.trim().slice(0,200);
      var pf=$('#f-fav').checked,phas=S.favP.indexOf(p.id)>=0;
      if(pf&&!phas&&S.favP.length<4)S.favP.push(p.id);
      if(!pf&&phas)S.favP=S.favP.filter(function(x){return x!==p.id});
      putPlayer(p.id);if(S.favP.join()!==f3)putFavs();
      closeDlg();render();toast('Saved');
      break;}
    case 'del-player':{
      var d3=D.id,f4=S.favP.join();delete S.players[d3];S.favP=S.favP.filter(function(x){return x!==d3});
      delPlayer(d3);if(S.favP.join()!==f4)putFavs();
      closeDlg();render();toast('Player removed');break;}
    case 'favm-left':move(S.favM,id,-1);putFavs();render();break;
    case 'favm-del':S.favM=S.favM.filter(function(x){return x!==id});putFavs();render();break;
    case 'favp-up':move(S.favP,id,-1);putFavs();render();break;
    case 'favp-del':S.favP=S.favP.filter(function(x){return x!==id});putFavs();render();break;
    case 'sign-in':openAuth('signin');break;
    case 'sign-out':closeDlg();if(SB)SB.auth.signOut().then(function(r){if(r.error)toast('Couldn’t sign out. Try again.')});break;
    case 'auth-mode':openAuth(t.dataset.mode);break;
    case 'auth-google':googleSignIn();break;
    case 'import':doImport();break;
    case 'import-skip':setImported();render();break;
    case 'copy-link':
      if(navigator.clipboard)navigator.clipboard.writeText(profileUrl(ME.username)).then(function(){toast('Link copied')},function(){toast('Couldn’t copy. Select the link and copy it instead.')});
      break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.act==='toggle-logged'){V.logged=t.checked;render()}
});
var qTimer;
document.addEventListener('input',function(e){
  if(e.target.id!=='people-q')return;
  PEOPLE.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(loadPeople,250);
});
document.addEventListener('submit',function(e){
  var f=e.target.id;
  if(f==='auth-form'){e.preventDefault();submitAuth()}
  else if(f==='username-form'){e.preventDefault();submitUsername()}
  else if(f==='newpass-form'){e.preventDefault();submitNewPassword()}
});
$('#dlg').addEventListener('cancel',function(e){if(D&&D.type==='username')e.preventDefault()});
$('#dlg').addEventListener('close',function(){D=null});

/* ---------- accounts and public profiles (Supabase) ---------- */
function fetchUserData(p){
  return Promise.all([
    SB.from('match_logs').select('match_id,rating,mode,review,logged_at').eq('user_id',p.id).limit(2000),
    SB.from('player_ratings').select('player_id,name,team,rating,note').eq('user_id',p.id).limit(1000),
    SB.from('custom_matches').select('id,md,match_date,home,home_goals,away,away_goals').eq('user_id',p.id).limit(200)
  ]).then(function(r){
    r.forEach(function(x){if(x.error)throw x.error});
    var o={logs:{},players:{},favM:p.fav_matches||[],favP:p.fav_players||[],custom:[]};
    r[0].data.forEach(function(l){o.logs[l.match_id]={rating:l.rating,mode:l.mode,review:l.review,ts:Date.parse(l.logged_at)}});
    r[1].data.forEach(function(x){o.players[x.player_id]={name:x.name,team:x.team,rating:x.rating,note:x.note}});
    o.custom=r[2].data.map(function(c){return{id:c.id,md:c.md,date:c.match_date,home:c.home,hs:c.home_goals,away:c.away,as:c.away_goals}});
    return clean(o);
  });
}
function reloadMe(){
  var me=ME;if(!me)return;
  fetchUserData(me).then(function(d){if(ME===me){S=d;render()}}).catch(function(e){console.error(e)});
}

// Ratings saved in this browser before signing in, not yet in the account.
function importable(){
  if(!ME)return null;
  try{if(localStorage.getItem(KEY+'.imported.'+ME.id))return null}catch(e){}
  var d=load();
  var logs=Object.keys(d.logs).filter(function(id){return !S.logs[id]}).length;
  var players=Object.keys(d.players).filter(function(id){return !S.players[id]}).length;
  return logs||players?{d:d,logs:logs,players:players}:null;
}
function setImported(){try{localStorage.setItem(KEY+'.imported.'+ME.id,'1')}catch(e){}}
function doImport(){
  var x=importable();if(!x)return;
  var d=x.d,logs=[],players=[],customs=[];
  Object.keys(d.logs).forEach(function(id){if(!S.logs[id]){S.logs[id]=d.logs[id];logs.push(logRow(id,d.logs[id]))}});
  Object.keys(d.players).forEach(function(id){if(!S.players[id]){S.players[id]=d.players[id];players.push(playerRow(d.players[id]))}});
  d.custom.forEach(function(c){if(!S.custom.some(function(o){return o.id===c.id})){S.custom.push(c);customs.push(customRow(c))}});
  if(!S.favM.length)S.favM=d.favM.slice(0,4);
  if(!S.favP.length)S.favP=d.favP.slice(0,4);
  Promise.all([
    customs.length?SB.from('custom_matches').upsert(customs):null,
    logs.length?SB.from('match_logs').upsert(logs):null,
    players.length?SB.from('player_ratings').upsert(players):null,
    SB.from('profiles').update({fav_matches:S.favM,fav_players:S.favP}).eq('id',ME.id)
  ]).then(function(rs){
    var bad=rs.filter(function(r){return r&&r.error});
    if(bad.length){console.error(bad);toast('Some ratings couldn’t be imported. Try again.');reloadMe();return}
    setImported();render();
    toast('Imported '+[logs.length?plural(logs.length,'match'):'',players.length?plural(players.length,'player'):''].filter(Boolean).join(' and ')+'.');
  });
}

var peopleSeq=0;
function loadPeople(){
  if(!SB)return;
  var seq=++peopleSeq,q=PEOPLE.q.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  var query=SB.from('profiles').select('username').order('created_at',{ascending:false}).limit(50);
  if(q)query=query.ilike('username','%'+q.replace(/_/g,'\\_')+'%');
  query.then(function(r){
    if(seq!==peopleSeq)return;
    PEOPLE.err=r.error?'Couldn’t load people. Try again in a moment.':'';
    PEOPLE.list=r.error?null:r.data;
    var el=$('#people-list');if(el)el.innerHTML=peopleListHTML();
  });
}
function loadPublic(name){
  PUB={name:name,data:null,err:''};
  if(!SB){PUB.err='Accounts aren’t set up for this copy of Fulltime yet.';return}
  SB.from('profiles').select('id,username,fav_matches,fav_players').eq('username',name).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    if(!r.data){if(PUB.name===name)PUB.err='There’s no one called @'+name+'.';return}
    return fetchUserData(r.data).then(function(d){if(PUB.name===name)PUB.data=d});
  }).catch(function(e){console.error(e);if(PUB.name===name)PUB.err='Couldn’t load this profile. Try again in a moment.'})
  .then(function(){if(V.user===name)render()});
}
// Routes: #/u/<username> shows a public profile, #/people lists everyone.
function route(){
  var m=location.hash.match(/^#\/u\/([A-Za-z0-9_]{3,20})$/);
  if(m){V.tab='people';V.user=m[1].toLowerCase();loadPublic(V.user)}
  else if(location.hash==='#/people'){V.tab='people';V.user=null;if(PEOPLE.list===null)loadPeople()}
  else if(V.user)V.user=null;
  else return false;
  render();window.scrollTo(0,0);return true;
}

function siteUrl(){return location.origin+location.pathname}
function authError(e){
  var m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m))return 'That email and password don’t match.';
  if(/email not confirmed/i.test(m))return 'Confirm your email first. Check your inbox for the link.';
  if(/already registered/i.test(m))return 'There’s already an account with that email. Sign in instead.';
  if(/rate limit/i.test(m))return 'Too many attempts. Wait a few minutes and try again.';
  if(/fetch|network/i.test(m))return 'Couldn’t reach the server. Check your connection and try again.';
  return m||'Something went wrong. Try again.';
}
function openAuth(mode){
  if(!SB)return;
  D={type:'auth',mode:mode};
  var title={signin:'Sign in',signup:'Create an account',reset:'Reset your password'}[mode];
  var h='<h2>'+title+'</h2>';
  if(mode==='reset')h+='<p class="sub">We’ll email you a link to choose a new password.</p>';
  else h+='<p class="sub">Use your Google account, or an email and password.</p><div class="actions"><button class="btn ghost wide" data-act="auth-google">Continue with Google</button></div><div class="or">or</div>';
  h+='<form id="auth-form" novalidate><label class="f" for="au-email">Email</label><input type="email" id="au-email" autocomplete="email" required>';
  if(mode!=='reset')h+='<label class="f" for="au-pass">Password</label><input type="password" id="au-pass" minlength="8" required autocomplete="'+(mode==='signup'?'new-password':'current-password')+'">'
    +(mode==='signup'?'<p class="note" style="margin-top:6px">At least 8 characters.</p>':'');
  h+='<p class="formerr" id="au-msg" role="status"></p><div class="actions"><button class="btn" type="submit">'+{signin:'Sign in',signup:'Create account',reset:'Send reset link'}[mode]+'</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>';
  h+='<p class="note" style="margin-top:18px">'+(mode==='signin'
    ?'New here? <button class="link" data-act="auth-mode" data-mode="signup">Create an account</button> · <button class="link" data-act="auth-mode" data-mode="reset">Forgot your password?</button>'
    :'Already have an account? <button class="link" data-act="auth-mode" data-mode="signin">Sign in</button>')+'</p>';
  openDlg(h);
  $('#au-email').focus();
}
function submitAuth(){
  var mode=D&&D.mode,email=$('#au-email').value.trim(),pass=$('#au-pass')?$('#au-pass').value:'';
  var msg=$('#au-msg'),btn=$('#auth-form button[type=submit]');
  msg.className='formerr';msg.textContent='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent='Enter a valid email address.';return}
  if(mode!=='reset'&&pass.length<8){msg.textContent='Passwords need at least 8 characters.';return}
  btn.disabled=true;
  var p=mode==='signin'?SB.auth.signInWithPassword({email:email,password:pass})
    :mode==='signup'?SB.auth.signUp({email:email,password:pass,options:{emailRedirectTo:siteUrl()}})
    :SB.auth.resetPasswordForEmail(email,{redirectTo:siteUrl()});
  p.then(function(r){
    btn.disabled=false;
    if(r.error){msg.textContent=authError(r.error);return}
    if(mode==='signin'||(mode==='signup'&&r.data&&r.data.session)){closeDlg();return}
    msg.className='formerr ok';
    msg.textContent=mode==='signup'?'Check your email for a link to confirm your account, then sign in.':'If that email has an account, a reset link is on its way.';
  }).catch(function(){btn.disabled=false;msg.textContent='Something went wrong. Check your connection and try again.'});
}
function googleSignIn(){
  SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:siteUrl()}}).then(function(r){
    var msg=$('#au-msg');if(r.error&&msg)msg.textContent=authError(r.error);
  });
}
function openUsername(){
  D={type:'username'};
  var meta=USER.user_metadata||{};
  var guess=(meta.full_name||meta.name||(USER.email||'').split('@')[0]||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,20);
  if(guess.length<3)guess='';
  openDlg('<h2>Pick a username</h2><p class="sub">It’s your profile link and appears next to your reviews. Use 3 to 20 lowercase letters, numbers or underscores.</p>'
    +'<form id="username-form" novalidate><label class="f" for="un">Username</label><input type="text" id="un" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(guess)+'">'
    +'<p class="formerr" id="un-msg" role="status"></p><div class="actions"><button class="btn" type="submit">Save username</button><button class="btn ghost" type="button" data-act="sign-out">Sign out</button></div></form>');
  $('#un').focus();
}
function submitUsername(){
  var u=$('#un').value.trim().toLowerCase(),msg=$('#un-msg'),user=USER;
  if(!/^[a-z0-9_]{3,20}$/.test(u)){msg.textContent='Use 3 to 20 lowercase letters, numbers or underscores.';return}
  SB.from('profiles').insert({id:user.id,username:u}).select('id,username,fav_matches,fav_players').single().then(function(r){
    if(r.error){msg.textContent=r.error.code==='23505'?'That username is taken. Try another.':'Couldn’t save your username. Try again.';return}
    if(USER!==user)return;
    ME=r.data;S=blank();closeDlg();render();
    toast(importable()?'Welcome, @'+u+'. You can import your earlier ratings from your profile.':'Welcome, @'+u+'.');
  });
}
function openNewPassword(){
  D={type:'newpass'};
  openDlg('<h2>Choose a new password</h2><form id="newpass-form" novalidate><label class="f" for="np">New password</label><input type="password" id="np" minlength="8" autocomplete="new-password">'
    +'<p class="note" style="margin-top:6px">At least 8 characters.</p><p class="formerr" id="np-msg" role="status"></p>'
    +'<div class="actions"><button class="btn" type="submit">Save password</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>');
  $('#np').focus();
}
function submitNewPassword(){
  var p=$('#np').value,msg=$('#np-msg');
  if(p.length<8){msg.textContent='Passwords need at least 8 characters.';return}
  SB.auth.updateUser({password:p}).then(function(r){
    if(r.error){msg.textContent=authError(r.error);return}
    closeDlg();toast('Password updated');
  });
}
function handleSession(session){
  var u=session?session.user:null;
  if(!BOOT&&(u&&u.id)===(USER&&USER.id))return;
  BOOT=false;USER=u;ME=null;
  if(!u){S=load();render();return}
  S=blank();render();
  SB.from('profiles').select('id,username,fav_matches,fav_players').eq('id',u.id).maybeSingle().then(function(r){
    if(USER!==u)return;
    if(r.error)throw r.error;
    if(!r.data){openUsername();return}
    ME=r.data;
    return fetchUserData(ME).then(function(d){
      if(USER!==u)return;
      S=d;render();
      if(importable())toast('You have ratings saved in this browser. Import them from your profile.');
    });
  }).catch(function(e){console.error(e);toast('Couldn’t load your account. Reload the page to try again.')});
}
function initAuth(){
  var c=window.FULLTIME_CONFIG||{};
  if(!window.supabase||!c.supabaseUrl||!c.supabaseKey){BOOT=false;return}
  try{SB=window.supabase.createClient(c.supabaseUrl,c.supabaseKey,{auth:{flowType:'pkce'}})}
  catch(e){console.error(e);SB=null;BOOT=false;return}
  SB.auth.onAuthStateChange(function(event,session){
    // Defer: supabase-js warns against calling it from inside this callback.
    setTimeout(function(){
      if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
      handleSession(session);
      if(event==='PASSWORD_RECOVERY')openNewPassword();
    },0);
  });
}

window.addEventListener('hashchange',route);
initAuth();
if(!route())render();
})();
</script>
