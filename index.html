<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fulltime: rate every Champions League match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F5F2EB; --surface:#FFFFFF; --sunk:#EFEBE2; --ink:#15192A; --muted:#5D6473; --line:#E3DED3; --line-strong:#CFC8BA;
  --accent:#0E6B47; --accent-ink:#FFFFFF; --accent-soft:#E2F0E8; --gold:#E0A30B; --star-off:#DAD4C8; --danger:#B3351F;
  --shadow:0 1px 2px rgba(21,25,42,.05),0 6px 20px rgba(21,25,42,.06);
  --radius:14px;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;letter-spacing:.005em}
p{margin:0}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 20px;min-height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em}
.logo::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:3px}
nav{display:flex;gap:2px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:20px 12px 14px;color:var(--muted);font-weight:500}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

main{padding:40px 0 96px}
.lede{color:var(--muted);max-width:62ch;margin-top:12px;font-size:17px}
.pagehead{margin-bottom:28px}
.pagehead h1{font-size:clamp(40px,7.5vw,62px)}
.eyebrow{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:9px 18px;font-weight:700;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{box-shadow:0 2px 10px rgba(14,107,71,.25)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none}
.btn.danger{background:var(--surface);color:var(--danger);border-color:var(--line-strong)}
.btn.danger:hover{border-color:var(--danger);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tiny{font-size:13px;padding:4px 11px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted);font-weight:500}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.spacer{flex:1}
.check{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* cards: match lists, player lists and rankings sit on white */
ul.list,ol.list{list-style:none;margin:0;padding:0}
.list,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.mrow{border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mbtn{display:grid;grid-template-columns:104px 1fr 128px;align-items:center;gap:8px 12px;width:100%;background:none;border:0;padding:16px 18px;text-align:left}
.mbtn:hover{background:#FBFAF7}
.mdate{font-size:13px;color:var(--muted);line-height:1.35}
.mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.th{text-align:right;font-weight:500}
.ta{text-align:left;font-weight:500}
.sc{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.04em;min-width:78px;text-align:center;background:var(--sunk);border-radius:10px;padding:2px 10px;line-height:1.15}
.win{font-weight:700}
.mmine{justify-self:end;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.mmine .logit{border:1px solid var(--line-strong);border-radius:999px;padding:3px 12px;color:var(--ink);font-weight:500}
@media (max-width:600px){
  .mbtn{grid-template-columns:1fr auto;grid-template-areas:"d m" "t t";padding:14px}
  .mdate{grid-area:d}.mmine{grid-area:m}.mteams{grid-area:t}
  .sc{font-size:28px;min-width:64px}
}

/* stars */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.st{position:relative;display:inline-block;width:28px;height:28px;--f:0}
.st::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold) calc(var(--f)*100%),var(--star-off) calc(var(--f)*100%));clip-path:polygon(50% 2%,62% 36%,98% 36%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 36%,38% 36%)}
.st.sm{width:15px;height:15px}
.half{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0}
.half.l{left:0}.half.r{right:0}
.rate{display:flex;align-items:center;gap:14px}
.rate .stars{gap:4px}
.rate .st{width:36px;height:36px}
.rv{color:var(--muted);min-width:70px}

/* forms */
label.f,p.f{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:3px solid var(--accent-soft);outline-offset:0}
textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addp{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.addp label.f{margin-top:0}
@media (max-width:600px){.addp{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
.note{color:var(--muted);font-size:14px}

/* dialog */
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(21,25,42,.25)}
dialog::backdrop{background:rgba(21,25,42,.45);backdrop-filter:blur(2px)}
.dlg{padding:26px 26px 22px}
.dlg h2{font-size:36px}
.dlg .sub{color:var(--muted);margin-top:4px}
.dlg .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.dlg .actions .spacer{flex:1}
.take{padding:14px 18px;border-bottom:1px solid var(--line)}
.take:last-child{border-bottom:0}
.take b{font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 18px;text-align:left;color:inherit}
.prow:last-child{border-bottom:0}
.prow:hover{background:#FBFAF7}
.pname{font-weight:700;font-size:17px}
.pteam{color:var(--muted);font-size:14px}
.pnote{grid-column:1/-1;color:var(--muted);font-size:14px}
.pos{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.ratebtn{font-size:13px;color:var(--accent);font-weight:700}
.posgroup{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 18px 8px;background:#FBFAF7;border-bottom:1px solid var(--line)}
.clubbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:16px}
.clubbar>div{flex:1;min-width:220px}
.clubbar label.f{margin-top:0}
details.more{margin-top:28px}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.more .addp{margin-top:14px}

/* rankings (players and clubs) */
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px 14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .rk{font-size:30px;grid-row:auto}
.rrow.fav{background:var(--accent-soft)}
.rctl{display:flex;align-items:center;gap:6px}
.rctl select{width:auto;padding:4px 8px;font-size:13px;border-radius:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0;font-size:14px;line-height:1}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:default}
.favbadge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-left:8px}
.clubpick{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:34px}
.clubpick h2{font-size:28px}
.supports{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}

/* profile */
.phead h1{font-size:clamp(44px,9vw,72px)}
.phead p{color:var(--muted);margin-top:10px}
.sect{margin-top:48px}
.sect>h2{font-size:30px;margin-bottom:16px}
.tops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.tops{grid-template-columns:1fr}}
.stub{position:relative;display:grid;grid-template-columns:1fr 104px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:160px}
.stub::before,.stub::after{content:"";position:absolute;right:95px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-10px;clip-path:inset(50% 0 0 0)}
.stub::after{bottom:-10px;clip-path:inset(0 0 50% 0)}
.stub-main{padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stub-meta{font-size:13px;color:var(--muted)}
.stub-line{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.stub-line b{font-family:var(--display);font-size:26px;line-height:1}
.stub-line.w{font-weight:700}
.stub-rev{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.stub-ctl{margin-top:auto;display:flex;gap:6px;padding-top:6px}
.stub-side{border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;text-align:center}
.stub-side .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.stub-side .stars{gap:1px;flex-wrap:wrap;justify-content:center;max-width:84px}
.stub-side .mode{font-size:12px;color:var(--muted);line-height:1.25}
.empty-slot{display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted);background:transparent;width:100%}
.empty-slot:hover{border-color:var(--accent);color:var(--accent)}
ol.ranks{list-style:none;margin:0;padding:0}
.rank{display:grid;grid-template-columns:48px 1fr auto;gap:2px 14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rk{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent);grid-row:span 2}
.rank .pnote{grid-column:2/-1}
.rank .ctl{display:flex;gap:6px}
.diary-row{padding:14px 18px;border-bottom:1px solid var(--line)}
.diary-row:last-child{border-bottom:0}
.diary-row .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.diary-row .t b{font-weight:700}
.diary-row p{color:var(--muted);margin-top:4px;max-width:70ch}

/* panels and people */
.panel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:32px}
.panel h2{font-size:28px;margin-bottom:6px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow b{font-size:17px}
.status{margin-top:8px;font-size:14px;color:var(--muted)}
.status.err{color:var(--danger)}
.empty{padding:30px 0;color:var(--muted)}

/* accounts */
.hright{display:flex;align-items:center;gap:12px}
.acct{display:flex;align-items:center;gap:10px;font-size:14px}
.acct .who{background:none;border:0;padding:0;font-weight:700;color:var(--ink)}
@media (max-width:640px){
  header.top .wrap{padding-top:8px}
  .hright{order:1}
  nav{order:2;width:100%;overflow-x:auto}
  nav button{padding:14px 10px 12px}
}
a.btn{display:inline-block;text-decoration:none}
.formerr{margin-top:12px;font-size:14px;color:var(--danger)}
.formerr:empty{display:none}
.formerr.ok{color:var(--accent)}
.sharelink{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px}
.sharelink a{color:var(--accent);font-weight:700;word-break:break-all}
.panel .btns,.lhead .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* match rows as links, match page */
a.mbtn{color:inherit;text-decoration:none}
.sc.vs{font-size:20px;color:var(--muted);background:transparent}
.tag{font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:700}
.heart{color:var(--muted);font-size:16px;line-height:1}
.heart.on{color:var(--danger)}
.mrow.ranked{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 10px;padding-right:14px}
.lrk{font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent);min-width:44px;text-align:right}
.lctl{display:flex;gap:6px}
.mhero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px 26px;text-align:center}
.mmeta{color:var(--muted)}
.mscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-top:14px;font-family:var(--body);font-weight:500;font-size:clamp(18px,3.4vw,26px);line-height:1.2}
.mscore .th{text-align:right}.mscore .ta{text-align:left}.mscore .win{font-weight:800}
.sc.big{font-family:var(--display);font-weight:800;font-size:clamp(56px,12vw,96px);letter-spacing:.03em;line-height:1;background:transparent;padding:0}
.sc.big.vs{font-size:clamp(32px,7vw,48px)}
.mactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.who-link{color:var(--ink);font-weight:700;text-decoration:none}
.take p{margin-top:4px;color:var(--muted);max-width:70ch}

/* profile sections */
.subnav{margin-top:24px;margin-bottom:6px}
.subnav .chip{text-decoration:none}
.subhead{font-size:22px;margin:30px 0 10px}
.dday{font-size:13px;color:var(--muted);min-width:96px}
.mlink{color:var(--ink);font-weight:700;text-decoration:none}
.mlink:hover,.stub-meta:hover{text-decoration:underline}
a.stub-meta{text-decoration:none}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px}
.lcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;color:var(--ink);text-decoration:none;min-height:116px;transition:transform .15s,border-color .15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.lname{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05}
.ldesc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lhead{margin-bottom:16px}
.lhead h2{font-size:clamp(32px,6vw,44px)}
.picks{display:flex;flex-direction:column;gap:8px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin-top:26px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column}
.tn{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.tl{color:var(--muted);font-size:14px;margin-top:4px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.vbars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line-strong);margin-top:12px}
.vb{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;outline-offset:0}
.vb span{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.vb:hover span,.vb:focus-visible span{opacity:.75}
.vb[data-tip]:hover::after,.vb[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:3;pointer-events:none}
.vaxis{display:flex;gap:2px;font-size:12px;color:var(--muted);margin-top:6px}
.vaxis span{flex:1;text-align:center}
.vaxis.ends{justify-content:space-between}
.vaxis.ends span{flex:none}
.hbars{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.hl{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{height:12px;background:var(--sunk);border-radius:0 4px 4px 0}
.ht span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hn{font-size:14px;color:var(--muted);min-width:2ch;text-align:right}
@media (max-width:600px){.hbars{grid-template-columns:minmax(0,8rem) minmax(0,1fr) auto}.mrow.ranked{grid-template-columns:auto minmax(0,1fr)}.mrow.ranked .lctl{grid-column:2;padding-bottom:10px}.rrow{grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px}.rrow .rk{font-size:24px}.rctl{gap:4px}.rctl .stars{display:none}.iconbtn{width:30px;height:30px}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:50;max-width:calc(100vw - 32px);font-size:15px;box-shadow:0 8px 24px rgba(21,25,42,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .2s ease-out}@keyframes fade{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">

/* ---------- state ---------- */
function blank(){return{logs:{},players:{},favM:[],favP:[],custom:[],likes:[],watch:[],lists:[],favTeam:'',trank:[],prank:[]}}
var FKEY=/^\d{4}-\d\d-\d\d_[a-z0-9-]+_[a-z0-9-]+$/,LISTID=/^l[a-z0-9]{1,39}$/;
function str(v,n){return typeof v==='string'?v.slice(0,n):''}
function half(v){v=Number(v);return isFinite(v)?Math.max(0,Math.min(5,Math.round(v*2)/2)):0}
function int(v){v=parseInt(v,10);return isFinite(v)?Math.max(0,Math.min(99,v)):0}
function clean(o){
  var out=blank();
  if(!o||typeof o!=='object')return out;
  if(o.logs&&typeof o.logs==='object'){
    var n=0;
    Object.keys(o.logs).forEach(function(k){
      if(n++>2000)return;
      var l=o.logs[k]||{};
      out.logs[str(k,40)]={rating:half(l.rating),mode:MODES[l.mode]?l.mode:'live',review:str(l.review,400),ts:Number(l.ts)||0};
    });
  }
  if(o.players&&typeof o.players==='object'){
    var m=0;
    Object.keys(o.players).forEach(function(k){
      if(m++>1000)return;
      var p=o.players[k]||{};
      out.players[str(k,100)]={id:str(k,100),name:str(p.name,60),team:str(p.team,40),rating:half(p.rating),note:str(p.note,200)};
    });
  }
  if(Array.isArray(o.custom)){
    out.custom=o.custom.slice(0,200).map(function(c){
      c=c||{};
      return{id:str(c.id,40),md:Math.max(1,Math.min(9,int(c.md)||1)),date:/^\d{4}-\d\d-\d\d$/.test(c.date)?c.date:'2026-01-01',home:str(c.home,40),hs:int(c.hs),away:str(c.away,40),as:int(c.as)};
    });
  }
  if(Array.isArray(o.favM))out.favM=o.favM.slice(0,4).map(function(x){return str(x,40)});
  if(Array.isArray(o.favP))out.favP=o.favP.slice(0,4).map(function(x){return str(x,100)});
  if(Array.isArray(o.likes))out.likes=o.likes.slice(0,2000).map(function(x){return str(x,40)}).filter(Boolean);
  if(Array.isArray(o.watch))out.watch=o.watch.slice(0,500).filter(function(x){return typeof x==='string'&&x.length<=140&&FKEY.test(x)});
  if(Array.isArray(o.lists)){
    out.lists=o.lists.slice(0,50).filter(function(l){return l&&LISTID.test(l.id)}).map(function(l){
      return{id:l.id,name:str(l.name,60)||'Untitled list',desc:str(l.desc,300),items:Array.isArray(l.items)?l.items.slice(0,100).map(function(x){return str(x,40)}).filter(Boolean):[],ts:Number(l.ts)||0};
    });
  }
  out.favTeam=TEAMS.indexOf(o.favTeam)>=0?o.favTeam:'';
  if(Array.isArray(o.trank)){var st={};out.trank=o.trank.filter(function(t){return TEAMS.indexOf(t)>=0&&!st[t]&&(st[t]=1)})}
  if(Array.isArray(o.prank)){var sp={};out.prank=o.prank.map(function(x){return str(x,100)}).filter(function(x){return x&&!sp[x]&&(sp[x]=1)}).slice(0,100)}
  return out;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return clean(JSON.parse(r))}catch(e){}
  return blank();
}

function remote(q){

}
function iso(ts){return new Date(ts||Date.now()).toISOString()}

function putLog(id){saveLocal();if(ME)remote(SB.from('match_logs').upsert(logRow(id,S.logs[id])))}
function delLog(id){saveLocal();if(ME)remote(SB.from('match_logs').delete().eq('user_id',ME.id).eq('match_id',id))}
function putPlayer(id){saveLocal();if(ME)remote(SB.from('player_ratings').upsert(playerRow(S.players[id])))}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(sel,root){return(root||document).querySelector(sel)}
function allMatches(d){return BASE.concat(d.custom)}
function matchById(id,d){var a=id.charAt(0)==='u'?UP:allMatches(d);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
// A fixture's identity that survives it moving from UPCOMING to RAW (match ids are positional).
function fkey(m){return m.date+'_'+slug(m.home)+'_'+slug(m.away)}
function byKey(k,d){
  var a=allMatches(d).concat(UP);
  for(var i=0;i<a.length;i++)if(fkey(a[i])===k)return a[i];
  return null;
}
function fmtTs(ts){try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function newId(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function mdLabel(md){return md===9?'Knockouts':'Matchday '+md}
function fmtDate(d){try{return new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}catch(e){return d}}
function fill(i,v){return Math.max(0,Math.min(1,v-(i-1)))}
function starsHTML(v){
  var h='<span class="stars" role="img" aria-label="'+v+' out of 5 stars">';
  for(var i=1;i<=5;i++)h+='<span class="st sm" style="--f:'+fill(i,v)+'"></span>';
  return h+'</span>';
}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function plural(n,w){return n+' '+(n===1?w:/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':/(s|x|z|ch|sh)$/.test(w)?w+'es':w+'s')}
var toastTimer;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3200);
}
function teamOptions(sel){
  return '<option value="">Choose a club</option>'+TEAMS.map(function(t){return'<option'+(t===sel?' selected':'')+'>'+esc(t)+'</option>'}).join('');
}

function render(){
  var tab=V.match?'matches':V.tab;
  document.querySelectorAll('nav [data-tab]').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});
  renderAcct();
  var m=$('#main');
  m.innerHTML=V.match?matchPage(V.match):V.tab==='matches'?matchesView():V.tab==='players'?playersView():V.tab==='clubs'?clubsView():V.tab==='profile'?profileView():peopleView();
}

function renderAcct(){
  var a=$('#acct');
  if(!SB||BOOT){a.innerHTML='';return}
  if(!USER){a.innerHTML='<button class="btn tiny" data-act="sign-in">Sign in</button>';return}
  a.innerHTML=(ME?'<button class="who" data-act="tab" data-tab="profile">@'+esc(ME.username)+'</button>':'')+'<button class="btn ghost tiny" data-act="sign-out">Sign out</button>';
}

function scoreHTML(m,cls){return m.up?'<span class="sc vs'+(cls||'')+'">vs</span>':'<span class="sc'+(cls||'')+'">'+m.hs+'–'+m.as+'</span>'}
function matchTitle(m){return m.up?m.home+' v '+m.away:m.home+' '+m.hs+'–'+m.as+' '+m.away}
// One row in any match list. d is whose ratings, likes and watchlist to show.
function matchRow(m,d,o){
  o=o||{};
  var l=d.logs[m.id],liked=d.likes.indexOf(m.id)>=0,watching=d.watch.indexOf(fkey(m))>=0;
  var hw=!m.up&&m.hs>m.as,aw=!m.up&&m.as>m.hs,right='';
  if(m.up)right=watching?'<span class="tag">On watchlist</span>':'';
  else right=(l?(l.rating?starsHTML(l.rating):'<span>Logged</span>'):(o.mine?'<span class="logit">Log</span>':''))+(liked?'<span class="heart on" role="img" aria-label="Liked">♥</span>':'');
  var inner='<span class="mdate">'+esc(fmtDate(m.date))+'<br>'+esc(mdLabel(m.md))+'</span>'
    +'<span class="mteams"><span class="th'+(hw?' win':'')+'">'+esc(m.home)+'</span>'+scoreHTML(m)+'<span class="ta'+(aw?' win':'')+'">'+esc(m.away)+'</span></span>'
    +'<span class="mmine">'+right+'</span>';
  var linkable=m.id.charAt(0)!=='c'||d===S;
  var row=linkable?'<a class="mbtn" href="#/m/'+esc(m.id)+'" aria-label="'+esc(matchTitle(m)+', '+fmtDate(m.date))+'">'+inner+'</a>':'<div class="mbtn">'+inner+'</div>';
  return '<li class="mrow'+(o.pre||o.post?' ranked':'')+'">'+(o.pre||'')+row+(o.post||'')+'</li>';
}

function matchesView(){

/* ---------- players, clubs and rankings ---------- */
var POS={GK:'Goalkeepers',DEF:'Defenders',MID:'Midfielders',FWD:'Forwards','':'Others'};
function pid(name,team){return slug(name)+'|'+slug(team)}
function rankedPlayers(d){return d.prank.filter(function(id){return d.players[id]})}
// Clubs the user has ranked, then the rest A–Z.
function teamOrder(d){
  var r=d.trank.filter(function(t){return TEAMS.indexOf(t)>=0});
  return r.concat(TEAMS.filter(function(t){return r.indexOf(t)<0}).sort(function(a,b){return a.localeCompare(b)}));
}
function rankMove(kind,key,to){
  var arr=kind==='team'?teamOrder(S):rankedPlayers(S),i=arr.indexOf(key);
  if(i<0)return;
  to=Math.max(0,Math.min(arr.length-1,to));
  arr.splice(i,1);arr.splice(to,0,key);
  if(kind==='team')S.trank=arr;else S.prank=arr;
  putExtras();render();
}
// One row of an editable ranking: number, label, position picker, up/down (and remove for players).
function rankRow(i,n,label,extra,kind,key,fav,name){
  var opts='';for(var j=1;j<=n;j++)opts+='<option value="'+j+'"'+(j===i+1?' selected':'')+'>'+j+'</option>';
  return '<li class="rrow'+(fav?' fav':'')+'"><span class="rk" aria-hidden="true">'+(i+1)+'</span><span>'+label+'</span><span class="rctl">'+extra
    +'<select class="rankpos" data-kind="'+kind+'" data-key="'+esc(key)+'" aria-label="Rank for '+esc(name)+'">'+opts+'</select>'
    +'<button class="iconbtn" data-act="rank-move" data-kind="'+kind+'" data-key="'+esc(key)+'" data-dir="-1" aria-label="Move '+esc(name)+' up"'+(i===0?' disabled':'')+'>↑</button>'
    +'<button class="iconbtn" data-act="rank-move" data-kind="'+kind+'" data-key="'+esc(key)+'" data-dir="1" aria-label="Move '+esc(name)+' down"'+(i===n-1?' disabled':'')+'>↓</button>'
    +(kind==='player'?'<button class="iconbtn" data-act="rank-del" data-key="'+esc(key)+'" aria-label="Remove '+esc(name)+' from ranking">✕</button>':'')
    +'</span></li>';
}

function playersView(){
  var nRated=Object.keys(S.players).filter(function(k){return S.players[k].rating>0}).length,nRank=rankedPlayers(S).length;

function ratedHTML(){

function socialHTML(id){
  var h='<section class="sect"><h2>Fans’ ratings</h2>';

/* ---------- charts ---------- */
// Vertical bars. items: [{n, label, tip}]. ends: show only the first and last label.
function vbars(items,ends){
  var max=Math.max.apply(null,items.map(function(i){return i.n}))||1;
  var h='<div class="vbars">';
  items.forEach(function(i){
    h+='<div class="vb" tabindex="0" role="img" aria-label="'+esc(i.tip)+'" data-tip="'+esc(i.tip)+'"><span class="'+(i.n?'':'zero')+'" style="height:'+(i.n?Math.max(3,i.n/max*100):0)+'%"></span></div>';
  });
  h+='</div><div class="vaxis'+(ends?' ends':'')+'" aria-hidden="true">';
  if(ends)h+='<span>'+esc(items[0].label)+'</span><span>'+esc(items[items.length-1].label)+'</span>';
  else items.forEach(function(i){h+='<span>'+esc(i.label)+'</span>'});
  return h+'</div>';
}
// Horizontal bars with the count printed beside each one. items: [{n, label}]
function hbars(items,unit){
  var max=Math.max.apply(null,items.map(function(i){return i.n}))||1;
  return '<div class="hbars">'+items.map(function(i){
    return '<span class="hl">'+esc(i.label)+'</span><span class="ht" title="'+esc(i.label+': '+plural(i.n,unit))+'"><span style="width:'+(i.n?Math.max(1,i.n/max*100):0)+'%"></span></span><span class="hn">'+i.n+'</span>';
  }).join('')+'</div>';
}
function ratingBars(ratings,unit){
  var items=[];
  for(var v=0.5;v<=5;v+=0.5){
    var n=ratings.filter(function(r){return r===v}).length;
    items.push({n:n,label:v===0.5?'½★':v+'★',tip:v+' stars: '+plural(n,unit)});
  }
  return vbars(items,true);
}

/* ---------- profiles ---------- */
var SECTIONS=[['overview','Profile'],['diary','Diary'],['likes','Likes'],['watchlist','Watchlist'],['lists','Lists'],['rankings','Rankings'],['stats','Stats']];
// o: {isMe, name, extra, sub, listId, user}. Own profile navigates with buttons, public ones with links.
function profileHTML(d,o){
  var byId={};allMatches(d).forEach(function(m){byId[m.id]=m});
  var logs=Object.keys(d.logs).filter(function(id){return byId[id]});
  var rated=logs.filter(function(id){return d.logs[id].rating>0});
  var avg=rated.length?rated.reduce(function(s,id){return s+d.logs[id].rating},0)/rated.length:0;
  var nPlayers=Object.keys(d.players).length;
  var h='<div class="phead"><h1>'+esc(o.name)+'</h1><p>'+plural(logs.length,'match')+' logged'+(rated.length?', averaging '+avg.toFixed(1)+' stars':'')+'. '+plural(nPlayers,'player')+' rated. '+plural(d.likes.length,'like')+'. '+plural(d.lists.length,'list')+'.</p>'+(d.favTeam?'<span class="supports">Supports '+esc(d.favTeam)+'</span>':'')+(o.extra||'')+'</div>';
  h+='<div class="chips subnav" role="navigation" aria-label="Profile sections">';
  SECTIONS.forEach(function(s){
    var cur=o.sub===s[0]?' aria-current="page"':'';
    h+=o.user?'<a class="chip" href="#/u/'+esc(o.user)+(s[0]==='overview'?'':'/'+s[0])+'"'+cur+'>'+s[1]+'</a>'
      :'<button class="chip" data-act="psub" data-s="'+s[0]+'"'+cur+'>'+s[1]+'</button>';
  });
  h+='</div>';
  var sub=o.sub;
  if(sub==='diary')h+=diaryHTML(d,o,byId,200);
  else if(sub==='likes')h+=likesHTML(d,o,byId);
  else if(sub==='watchlist')h+=watchlistHTML(d,o);
  else if(sub==='lists')h+=o.listId?listPageHTML(d,o,byId):listsHTML(d,o);
  else if(sub==='rankings')h+=rankingsHTML(d,o);
  else if(sub==='stats')h+=statsHTML(d,byId);
  else h+=overviewHTML(d,o,byId);
  return h;
}
function subLink(o,sub,text){

    h+='</ol>';
  }else{
    h+=isMe?'<p class="empty">Rate a player, then add them to your top four from the Players tab.</p>':'<p class="empty">No top players picked yet.</p>';
  }
  h+='</section>';
  h+='<section class="sect"><h2>Recent diary</h2>'+diaryHTML(d,o,byId,5,true)+'</section>';

}
function diaryHTML(d,o,byId,limit,brief){
  var logs=Object.keys(d.logs).filter(function(id){return byId[id]}).map(function(id){return[id,d.logs[id]]});
  logs.sort(function(a,b){return(b[1].ts||0)-(a[1].ts||0)});
  if(!logs.length)return '<p class="empty">'+(o.isMe?'Nothing logged yet. Open a match and give it some stars.':'Nothing logged yet.')+'</p>';
  var h='<div class="list">';
  logs.slice(0,limit).forEach(function(x){
    var m=byId[x[0]],l=x[1],title=esc(matchTitle(m));
    var linkable=m.id.charAt(0)!=='c'||o.isMe;
    h+='<div class="diary-row"><div class="t">'+(l.ts?'<span class="dday">'+esc(fmtTs(l.ts))+'</span>':'')+(linkable?'<a class="mlink" href="#/m/'+esc(m.id)+'">'+title+'</a>':'<b>'+title+'</b>')
      +(l.rating?starsHTML(l.rating):'')+(d.likes.indexOf(m.id)>=0?'<span class="heart on" role="img" aria-label="Liked">♥</span>':'')+'<span class="note">'+esc(MODES[l.mode]||'')+'</span></div>'+(l.review?'<p>'+esc(l.review)+'</p>':'')+'</div>';
  });
  h+='</div>';
  if(brief&&logs.length>limit)h+='<p style="margin-top:14px">'+subLink(o,'diary','See all '+plural(logs.length,'entry'))+'</p>';
  return h;
}
function likesHTML(d,o,byId){
  var ms=d.likes.map(function(id){return byId[id]}).filter(Boolean);
  if(!ms.length)return '<p class="empty">'+(o.isMe?'No likes yet. Open a match you loved and tap Like.':'No likes yet.')+'</p>';
  return '<ul class="list">'+ms.map(function(m){return matchRow(m,d)}).join('')+'</ul>';

function watchlistHTML(d,o){

function statsHTML(d,byId){
  var logs=Object.keys(d.logs).filter(function(id){return byId[id]}).map(function(id){return{m:byId[id],l:d.logs[id]}});
  if(!logs.length)return '<p class="empty">Log some matches and stats will show up here.</p>';
  var ratings=logs.map(function(x){return x.l.rating}).filter(function(r){return r>0});
  var avg=ratings.length?(ratings.reduce(function(a,b){return a+b},0)/ratings.length).toFixed(1):'–';
  var reviews=logs.filter(function(x){return x.l.review}).length;
  var h='<div class="tiles">'
    +tile(logs.length,'matches logged')+tile(avg,'average rating')+tile(reviews,reviews===1?'review':'reviews')
    +tile(d.likes.length,d.likes.length===1?'like':'likes')+tile(d.lists.length,d.lists.length===1?'list':'lists')+'</div>';
  h+='<section class="sect"><h2>Ratings</h2>'+(ratings.length?'<div class="chart">'+ratingBars(ratings,'match')+'</div>':'<p class="empty">No star ratings yet.</p>')+'</section>';
  h+='<section class="sect"><h2>How you watched</h2><div class="chart">'+hbars(Object.keys(MODES).map(function(k){
    return{label:MODES[k],n:logs.filter(function(x){return x.l.mode===k}).length};
  }),'match')+'</div></section>';
  var clubs={};
  logs.forEach(function(x){[x.m.home,x.m.away].forEach(function(t){clubs[t]=(clubs[t]||0)+1})});
  var top=Object.keys(clubs).map(function(t){return{label:t,n:clubs[t]}}).sort(function(a,b){return b.n-a.n||a.label.localeCompare(b.label)}).slice(0,8);
  h+='<section class="sect"><h2>Most-watched clubs</h2><div class="chart">'+hbars(top,'match')+'</div></section>';
  var mds=[1,2,3,4,5,6,7,8];
  if(logs.some(function(x){return x.m.md===9}))mds.push(9);
  h+='<section class="sect"><h2>Matches by round</h2><div class="chart">'+vbars(mds.map(function(md){
    var n=logs.filter(function(x){return x.m.md===md}).length;
    return{n:n,label:md===9?'KO':'MD'+md,tip:mdLabel(md)+': '+plural(n,'match')};
  }))+'</div></section>';
  return h;
}

function submitList(){

function submitAddTo(){
  var mid=D.id,name=$('#nl').value.trim().slice(0,60),added=0;
  if(name&&S.lists.length>=50){$('#at-msg').textContent='You can have up to 50 lists.';return}
  document.querySelectorAll('#addto-form input[name=lst]').forEach(function(c){

  });
  if(name){var nl={id:newId('l'),name:name,desc:'',items:[mid],ts:Date.now()};S.lists.unshift(nl);putList(nl);added++}
  closeDlg();render();toast(added?'Saved to '+plural(added,'list'):'Lists updated');

/* ---------- actions ---------- */
function move(arr,id,dir){var i=arr.indexOf(id);var j=i+dir;if(i<0||j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
function clearRoute(){if(location.hash)history.replaceState(null,'',location.pathname+location.search);V.user=null;V.match=null}

document.addEventListener('click',function(e){
  var dlg=$('#dlg');
  if(e.target===dlg){if(!D||D.type!=='username')closeDlg();return}
  var t=e.target.closest('[data-act]');
  if(!t)return;
  var act=t.dataset.act,id=t.dataset.id;
  switch(act){
    case 'tab':V.tab=t.dataset.tab;clearRoute();if(V.tab==='people'&&PEOPLE.list===null)loadPeople();render();window.scrollTo(0,0);break;
    case 'filter':V.filter=t.dataset.f;render();break;
    case 'open-match':openMatch(id);break;
    case 'open-player':openPlayer(id);break;
    case 'open-squad':{
      var sq=t.dataset.team,sn=t.dataset.name,sid=slug(sn)+'|'+slug(sq);
      openPlayer(sid,{id:sid,name:sn,team:sq,rating:0,note:''});break;}
    case 'ptab':V.ptab=t.dataset.p;render();break;
    case 'club-mine':V.club=S.favTeam;render();break;
    case 'rank-move':{
      var rk=t.dataset.kind,rarr=rk==='team'?teamOrder(S):rankedPlayers(S);
      rankMove(rk,t.dataset.key,rarr.indexOf(t.dataset.key)+parseInt(t.dataset.dir,10));break;}
    case 'rank-del':S.prank=S.prank.filter(function(x){return x!==t.dataset.key});putExtras();render();break;
    case 'prank-fill':{
      var add=Object.keys(S.players).map(function(k){return S.players[k]}).filter(function(p){return p.rating>0&&S.prank.indexOf(p.id)<0});
      add.sort(function(a,b){return b.rating-a.rating||a.name.localeCompare(b.name)});
      add=add.slice(0,Math.max(0,100-S.prank.length));
      if(!add.length){toast('Every player you’ve rated is already in your ranking.');break}
      S.prank=S.prank.concat(add.map(function(p){return p.id}));putExtras();render();toast('Added '+plural(add.length,'player'));break;}
    case 'trank-reset':if(confirm('Reset your club ranking to alphabetical order?')){S.trank=[];putExtras();render()}break;
    case 'add-match-open':openAddMatch();break;
    case 'go-matches':V.tab='matches';render();window.scrollTo(0,0);break;
    case 'close':closeDlg();break;
    case 'setr':if(D){D.rating=parseFloat(t.dataset.v);paintRate()}break;
    case 'clearr':if(D){D.rating=0;paintRate()}break;
    case 'save-match':{
      var rating=D.rating,review=$('#f-review').value.trim().slice(0,400),mode=$('#f-mode').value,fav=$('#f-fav').checked;
      var mid=D.id,favs=S.favM.join();
      if(!rating&&!review){delete S.logs[mid];S.favM=S.favM.filter(function(x){return x!==mid});delLog(mid)}
      else{
        var prev=S.logs[mid];
        S.logs[mid]={rating:rating,mode:mode,review:review,ts:prev?prev.ts:Date.now()};
        var has=S.favM.indexOf(mid)>=0;
        if(fav&&!has&&S.favM.length<4)S.favM.push(mid);
        if(!fav&&has)S.favM=S.favM.filter(function(x){return x!==mid});
        putLog(mid);
      }
      if(S.favM.join()!==favs)putFavs();
      closeDlg();render();toast('Saved to your diary');
      break;}
    case 'del-log':{
      var d1=D.id,f1=S.favM.join();delete S.logs[d1];S.favM=S.favM.filter(function(x){return x!==d1});
      delLog(d1);if(S.favM.join()!==f1)putFavs();
      closeDlg();render();toast('Removed from your diary');break;}
    case 'del-match':{
      var d2=D.id,f2=S.favM.join();
      S.custom=S.custom.filter(function(c){return c.id!==d2});
      delCustom(d2);
      if(S.logs[d2]){delete S.logs[d2];delLog(d2)}
      if(S.likes.indexOf(d2)>=0){S.likes=S.likes.filter(function(x){return x!==d2});delLike(d2)}
      if(V.match===d2)clearRoute();
      S.favM=S.favM.filter(function(x){return x!==d2});if(S.favM.join()!==f2)putFavs();
      closeDlg();render();toast('Match deleted');break;}
    case 'add-match-save':{
      var home=$('#a-home').value,away=$('#a-away').value,date=$('#a-date').value;
      var err=$('#a-err');
      if(!home||!away){err.textContent='Choose both clubs.';break}
      if(home===away){err.textContent='A club can’t play itself. Choose two different clubs.';break}
      if(!date){err.textContent='Pick the match date.';break}
      var c={id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),md:parseInt($('#a-md').value,10),date:date,home:home,hs:int($('#a-hs').value),away:away,as:int($('#a-as').value)};
      S.custom.push(c);putCustom(c);
      closeDlg();render();toast('Match added');
      break;}
    case 'add-player':{
      var name=$('#pn').value.trim().slice(0,60),team=$('#pt').value;

      if(!team){toast('Choose the player’s club.');$('#pt').focus();break}
      var pid=slug(name)+'|'+slug(team);
      if(S.players[pid]){toast(name+' is already in your list.');break}
      S.players[pid]={id:pid,name:name,team:team,rating:0,note:''};
      putPlayer(pid);render();toast(name+' added. Tap them to give a rating.');
      break;}
    case 'save-player':{
      var p=S.players[D.id];
      if(!p){if(!D.proto)break;p=S.players[D.id]=D.proto}
      var f3=S.favP.join(),r3=S.prank.join();
      p.rating=D.rating;p.note=$('#f-note').value.trim().slice(0,200);
      var pf=$('#f-fav').checked,phas=S.favP.indexOf(p.id)>=0;
      if(pf&&!phas&&S.favP.length<4)S.favP.push(p.id);
      if(!pf&&phas)S.favP=S.favP.filter(function(x){return x!==p.id});
      var pr=$('#f-rank').checked,rhas=S.prank.indexOf(p.id)>=0;
      if(pr&&!rhas&&S.prank.length<100)S.prank.push(p.id);
      if(!pr&&rhas)S.prank=S.prank.filter(function(x){return x!==p.id});
      putPlayer(p.id);if(S.favP.join()!==f3)putFavs();if(S.prank.join()!==r3)putExtras();
      closeDlg();render();toast('Saved');
      break;}
    case 'del-player':{
      var d3=D.id,f4=S.favP.join(),r4=S.prank.join();delete S.players[d3];S.favP=S.favP.filter(function(x){return x!==d3});
      S.prank=S.prank.filter(function(x){return x!==d3});
      delPlayer(d3);if(S.favP.join()!==f4)putFavs();if(S.prank.join()!==r4)putExtras();
      closeDlg();render();toast('Player removed');break;}
    case 'favm-left':move(S.favM,id,-1);putFavs();render();break;
    case 'favm-del':S.favM=S.favM.filter(function(x){return x!==id});putFavs();render();break;
    case 'favp-up':move(S.favP,id,-1);putFavs();render();break;
    case 'favp-del':S.favP=S.favP.filter(function(x){return x!==id});putFavs();render();break;
    case 'back':if(NAVS>0)history.back();else{clearRoute();render()}break;
    case 'like':{
      var li=S.likes.indexOf(id);
      if(li>=0){S.likes.splice(li,1);delLike(id)}else{S.likes.unshift(id);putLike(id)}
      render();break;}
    case 'watch':{
      var wm=matchById(id,S);if(!wm)break;
      var wk=fkey(wm),wi=S.watch.indexOf(wk);
      if(wi>=0){S.watch.splice(wi,1);delWatch(wk);toast('Removed from your watchlist')}
      else{S.watch.push(wk);putWatch(wk);toast('Added to your watchlist')}
      render();break;}
    case 'add-to-list':openAddToList(id);break;
    case 'psub':V.psub=t.dataset.s;V.listId=null;render();break;
    case 'new-list':openListEdit(null);break;
    case 'edit-list':openListEdit(id);break;
    case 'open-list':V.listId=id;render();window.scrollTo(0,0);break;
    case 'del-list':{
      var dl=listById(id);
      if(!dl||!confirm('Delete “'+dl.name+'”? This can’t be undone.'))break;
      S.lists=S.lists.filter(function(l){return l.id!==id});delList(id);
      closeDlg();V.listId=null;render();toast('List deleted');break;}
    case 'list-up':case 'list-remove':{
      var ol=listById(V.listId);if(!ol)break;
      if(act==='list-up')move(ol.items,id,-1);else ol.items=ol.items.filter(function(x){return x!==id});
      putList(ol);render();break;}
    case 'sign-in':openAuth('signin');break;
    case 'sign-out':closeDlg();if(SB)SB.auth.signOut().then(function(r){if(r.error)toast('Couldn’t sign out. Try again.')});break;
    case 'auth-mode':openAuth(t.dataset.mode);break;
    case 'change-pass':openNewPassword();break;
    case 'import':doImport();break;
    case 'import-skip':setImported();render();break;
    case 'copy-link':
      if(navigator.clipboard)navigator.clipboard.writeText(profileUrl(ME.username)).then(function(){toast('Link copied')},function(){toast('Couldn’t copy. Select the link and copy it instead.')});
      break;
  }
});

/* ---------- accounts and public profiles (Supabase) ---------- */
function fetchUserData(p){
  return Promise.all([
    SB.from('match_logs').select('match_id,rating,mode,review,logged_at').eq('user_id',p.id).limit(2000),
    SB.from('player_ratings').select('player_id,name,team,rating,note').eq('user_id',p.id).limit(1000),
    SB.from('custom_matches').select('id,md,match_date,home,home_goals,away,away_goals').eq('user_id',p.id).limit(200),
    SB.from('match_likes').select('match_id').eq('user_id',p.id).order('created_at',{ascending:false}).limit(1000),
    SB.from('watchlist').select('fixture').eq('user_id',p.id).order('added_at').limit(500),
    SB.from('lists').select('id,name,description,items,created_at').eq('user_id',p.id).order('created_at',{ascending:false}).limit(50)
  ]).then(function(r){
    r.forEach(function(x){if(x.error)throw x.error});
    var o={logs:{},players:{},favM:p.fav_matches||[],favP:p.fav_players||[],custom:[],favTeam:p.fav_team||'',trank:p.team_rank||[],prank:p.player_rank||[],
      likes:r[3].data.map(function(x){return x.match_id}),
      watch:r[4].data.map(function(x){return x.fixture}),
      lists:r[5].data.map(function(l){return{id:l.id,name:l.name,desc:l.description,items:l.items,ts:Date.parse(l.created_at)}})};
    r[0].data.forEach(function(l){o.logs[l.match_id]={rating:l.rating,mode:l.mode,review:l.review,ts:Date.parse(l.logged_at)}});
    r[1].data.forEach(function(x){o.players[x.player_id]={name:x.name,team:x.team,rating:x.rating,note:x.note}});
    o.custom=r[2].data.map(function(c){return{id:c.id,md:c.md,date:c.match_date,home:c.home,hs:c.home_goals,away:c.away,as:c.away_goals}});
    return clean(o);
  });
}
function reloadMe(){
  var me=ME;if(!me)return;
  fetchUserData(me).then(function(d){if(ME===me){S=d;render()}}).catch(function(e){console.error(e)});
}

// Ratings saved in this browser before signing in, not yet in the account.
function importable(){
  if(!ME)return null;
  try{if(localStorage.getItem(KEY+'.imported.'+ME.id))return null}catch(e){}
  var d=load();
  var logs=Object.keys(d.logs).filter(function(id){return !S.logs[id]}).length;
  var players=Object.keys(d.players).filter(function(id){return !S.players[id]}).length;
  var extra=d.likes.some(function(id){return S.likes.indexOf(id)<0})||d.watch.some(function(k){return S.watch.indexOf(k)<0})
    ||d.lists.some(function(l){return !listById(l.id)})||(d.favTeam&&!S.favTeam)||(d.trank.length&&!S.trank.length)||(d.prank.length&&!S.prank.length);
  return logs||players||extra?{d:d,logs:logs,players:players}:null;
}
function setImported(){try{localStorage.setItem(KEY+'.imported.'+ME.id,'1')}catch(e){}}
function doImport(){
  var x=importable();if(!x)return;
  var d=x.d,logs=[],players=[],customs=[];
  Object.keys(d.logs).forEach(function(id){if(!S.logs[id]){S.logs[id]=d.logs[id];logs.push(logRow(id,d.logs[id]))}});
  Object.keys(d.players).forEach(function(id){if(!S.players[id]){S.players[id]=d.players[id];players.push(playerRow(d.players[id]))}});
  d.custom.forEach(function(c){if(!S.custom.some(function(o){return o.id===c.id})){S.custom.push(c);customs.push(customRow(c))}});
  if(!S.favM.length)S.favM=d.favM.slice(0,4);
  if(!S.favP.length)S.favP=d.favP.slice(0,4);
  var likes=d.likes.filter(function(id){return S.likes.indexOf(id)<0});
  var watch=d.watch.filter(function(k){return S.watch.indexOf(k)<0});
  var lists=d.lists.filter(function(l){return !listById(l.id)}).slice(0,Math.max(0,50-S.lists.length));
  S.likes=likes.concat(S.likes);S.watch=S.watch.concat(watch);S.lists=S.lists.concat(lists);
  if(!S.favTeam)S.favTeam=d.favTeam;
  if(!S.trank.length)S.trank=d.trank.slice();
  if(!S.prank.length)S.prank=d.prank.filter(function(id){return S.players[id]});
  Promise.all([
    likes.length?SB.from('match_likes').upsert(likes.map(function(id){return{user_id:ME.id,match_id:id}})):null,
    watch.length?SB.from('watchlist').upsert(watch.map(function(k){return{user_id:ME.id,fixture:k}})):null,
    lists.length?SB.from('lists').upsert(lists.map(listRow)):null,
    customs.length?SB.from('custom_matches').upsert(customs):null,
    logs.length?SB.from('match_logs').upsert(logs):null,
    players.length?SB.from('player_ratings').upsert(players):null,
    SB.from('profiles').update({fav_matches:S.favM,fav_players:S.favP,fav_team:S.favTeam,team_rank:S.trank,player_rank:S.prank}).eq('id',ME.id)
  ]).then(function(rs){
    var bad=rs.filter(function(r){return r&&r.error});
    if(bad.length){console.error(bad);toast('Some ratings couldn’t be imported. Try again.');reloadMe();return}
    setImported();render();
    var parts=[logs.length?plural(logs.length,'match'):'',players.length?plural(players.length,'player'):'',likes.length?plural(likes.length,'like'):'',lists.length?plural(lists.length,'list'):''].filter(Boolean);
    toast(parts.length?'Imported '+parts.join(', ')+'.':'Imported your watchlist.');
  });
}

var peopleSeq=0;
function loadPeople(){
  if(!SB)return;
  var seq=++peopleSeq,q=PEOPLE.q.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  var query=SB.from('profiles').select('username').order('created_at',{ascending:false}).limit(50);
  if(q)query=query.ilike('username','%'+q.replace(/_/g,'\\_')+'%');
  query.then(function(r){
    if(seq!==peopleSeq)return;
    PEOPLE.err=r.error?'Couldn’t load people. Try again in a moment.':'';
    PEOPLE.list=r.error?null:r.data;
    var el=$('#people-list');if(el)el.innerHTML=peopleListHTML();
  });
}
function loadPublic(name){
  PUB={name:name,data:null,err:''};
  if(!SB){PUB.err='Accounts aren’t set up for this copy of Fulltime yet.';return}
  SB.from('profiles').select('*').eq('username',name).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    if(!r.data){if(PUB.name===name)PUB.err='There’s no one called @'+name+'.';return}
    return fetchUserData(r.data).then(function(d){if(PUB.name===name)PUB.data=d});
  }).catch(function(e){console.error(e);if(PUB.name===name)PUB.err='Couldn’t load this profile. Try again in a moment.'})
  .then(function(){if(V.user===name)render()});
}
function loadMatchSocial(id){
  MS={id:id,loading:true,logs:null,likes:0,err:''};
  Promise.all([
    SB.from('match_logs').select('rating,review,mode,profiles(username)').eq('match_id',id).order('logged_at',{ascending:false}).limit(500),
    SB.from('match_likes').select('user_id',{count:'exact',head:true}).eq('match_id',id)
  ]).then(function(r){
    if(MS.id!==id)return;
    if(r[0].error||r[1].error)throw r[0].error||r[1].error;
    MS.logs=r[0].data.map(function(x){
      var u=x.profiles&&x.profiles.username;
      return{rating:half(x.rating),review:str(x.review,400),mode:MODES[x.mode]?x.mode:'live',user:/^[a-z0-9_]{3,20}$/.test(u||'')?u:null};
    }).filter(function(x){return x.user});
    MS.likes=r[1].count||0;MS.loading=false;
  }).catch(function(e){console.error(e);if(MS.id===id){MS.loading=false;MS.err='Couldn’t load other fans’ ratings. Try again in a moment.'}})
  .then(function(){if(V.match===id)render()});
}
// Routes: #/m/<id> match page, #/u/<username>[/<section>][/lists/<list id>] public profile, #/people everyone.
function route(){
  var h=location.hash,m,prevUser=V.user;
  V.match=null;
  if((m=h.match(/^#\/m\/([A-Za-z0-9_-]{1,140})$/))){
    V.match=m[1];
    if(SB&&/^m\d+$/.test(V.match))loadMatchSocial(V.match);
  }else if((m=h.match(/^#\/u\/([A-Za-z0-9_]{3,20})(?:\/(diary|likes|watchlist|lists|rankings|stats))?(?:\/(l[a-z0-9]{1,39}))?$/))){
    var name=m[1].toLowerCase();
    V.tab='people';V.user=name;V.pubSub=m[2]||'overview';V.pubList=m[3]||null;
    if(prevUser!==name||PUB.name!==name||PUB.err)loadPublic(name);
  }else if(h==='#/people'){V.tab='people';V.user=null;if(PEOPLE.list===null)loadPeople()}
  else V.user=null;
  render();
  if(!(prevUser&&prevUser===V.user))window.scrollTo(0,0);
}

// Supabase Auth needs an email address, so each username maps to a placeholder
// address that is never shown or mailed. "Confirm email" must be off (SUPABASE.md).
var UNAME=/^[a-z0-9_]{3,20}$/;
function authEmail(u){return u+'@'+((window.FULLTIME_CONFIG||{}).authEmailDomain||'users.fulltime.invalid')}
function authError(e){
  var m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m))return 'That username and password don’t match.';
  if(/already registered|already exists/i.test(m))return 'That username is taken. Try another.';
  if(/database error saving new user/i.test(m))return 'That username is taken or not allowed. Try another.';
  if(/email not confirmed/i.test(m))return 'Sign-in is blocked because “Confirm email” is on in Supabase. The site owner needs to switch it off (see SUPABASE.md).';
  if(/email/i.test(m)&&/invalid/i.test(m))return 'The server rejected the account. The site owner needs to check the email settings in SUPABASE.md.';
  if(/weak|password should|pwned/i.test(m))return 'Pick a stronger password: at least 8 characters and not a common one.';
  if(/rate limit/i.test(m))return 'Too many attempts. Wait a few minutes and try again.';
  if(/fetch|network/i.test(m))return 'Couldn’t reach the server. Check your connection and try again.';
  return m||'Something went wrong. Try again.';
}
function openAuth(mode){
  if(!SB)return;
  var up=mode==='signup';
  D={type:'auth',mode:up?'signup':'signin'};
  var h='<h2>'+(up?'Create an account':'Sign in')+'</h2><p class="sub">'+(up?'Pick a username and a password. No email needed.':'Welcome back.')+'</p>'
    +'<form id="auth-form" novalidate><label class="f" for="au-user">Username</label><input type="text" id="au-user" maxlength="20" required autocomplete="username" autocapitalize="none" spellcheck="false">';
  if(up)h+='<p class="note" style="margin-top:6px">3 to 20 lowercase letters, numbers or underscores. It’s your profile link and can’t be changed later.</p>';
  h+='<label class="f" for="au-pass">Password</label><input type="password" id="au-pass" minlength="8" required autocomplete="'+(up?'new-password':'current-password')+'">';
  if(up)h+='<label class="f" for="au-pass2">Confirm password</label><input type="password" id="au-pass2" minlength="8" required autocomplete="new-password">'
    +'<p class="note" style="margin-top:6px">At least 8 characters. There’s no email to reset it with, so keep it somewhere safe.</p>';
  h+='<p class="formerr" id="au-msg" role="status"></p><div class="actions"><button class="btn" type="submit">'+(up?'Create account':'Sign in')+'</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>'
    +'<p class="note" style="margin-top:18px">'+(up?'Already have an account? <button class="link" data-act="auth-mode" data-mode="signin">Sign in</button>'
      :'New here? <button class="link" data-act="auth-mode" data-mode="signup">Create an account</button>')+'</p>';
  openDlg(h);
  $('#au-user').focus();
}
function submitAuth(){
  var up=D&&D.mode==='signup',u=$('#au-user').value.trim().toLowerCase(),pass=$('#au-pass').value;
  var msg=$('#au-msg'),btn=$('#auth-form button[type=submit]');
  msg.className='formerr';msg.textContent='';
  if(!UNAME.test(u)){msg.textContent='Usernames are 3 to 20 lowercase letters, numbers or underscores.';return}
  if(pass.length<8){msg.textContent='Passwords need at least 8 characters.';return}
  if(up&&pass!==$('#au-pass2').value){msg.textContent='The two passwords don’t match.';return}
  btn.disabled=true;
  var p=up?SB.auth.signUp({email:authEmail(u),password:pass,options:{data:{username:u}}})
    :SB.auth.signInWithPassword({email:authEmail(u),password:pass});
  p.then(function(r){
    btn.disabled=false;
    if(r.error){msg.textContent=authError(r.error);return}
    if(up&&!(r.data&&r.data.session)){
      msg.textContent='Your account was made, but Supabase wants email confirmation, which can’t work without email. The site owner needs to switch off “Confirm email” (see SUPABASE.md).';
      return;
    }
    closeDlg();
    if(up)toast('Welcome, @'+u+'.');
  }).catch(function(){btn.disabled=false;msg.textContent='Something went wrong. Check your connection and try again.'});
}
function openUsername(){
  D={type:'username'};
  var meta=USER.user_metadata||{};
  var guess=(meta.full_name||meta.name||(USER.email||'').split('@')[0]||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,20);
  if(guess.length<3)guess='';
  openDlg('<h2>Pick a username</h2><p class="sub">It’s your profile link and appears next to your reviews. Use 3 to 20 lowercase letters, numbers or underscores.</p>'
    +'<form id="username-form" novalidate><label class="f" for="un">Username</label><input type="text" id="un" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(guess)+'">'
    +'<p class="formerr" id="un-msg" role="status"></p><div class="actions"><button class="btn" type="submit">Save username</button><button class="btn ghost" type="button" data-act="sign-out">Sign out</button></div></form>');
  $('#un').focus();
}
function submitUsername(){
  var u=$('#un').value.trim().toLowerCase(),msg=$('#un-msg'),user=USER;
  if(!/^[a-z0-9_]{3,20}$/.test(u)){msg.textContent='Use 3 to 20 lowercase letters, numbers or underscores.';return}
  SB.from('profiles').insert({id:user.id,username:u}).select('*').single().then(function(r){
    if(r.error){msg.textContent=r.error.code==='23505'?'That username is taken. Try another.':'Couldn’t save your username. Try again.';return}
    if(USER!==user)return;
    ME=r.data;S=blank();closeDlg();render();
    toast(importable()?'Welcome, @'+u+'. You can import your earlier ratings from your profile.':'Welcome, @'+u+'.');
  });
}
function openNewPassword(){
  D={type:'newpass'};
  openDlg('<h2>Change your password</h2><form id="newpass-form" novalidate><label class="f" for="np">New password</label><input type="password" id="np" minlength="8" autocomplete="new-password">'
    +'<label class="f" for="np2">Confirm new password</label><input type="password" id="np2" minlength="8" autocomplete="new-password">'
    +'<p class="note" style="margin-top:6px">At least 8 characters.</p><p class="formerr" id="np-msg" role="status"></p>'
    +'<div class="actions"><button class="btn" type="submit">Save password</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>');
  $('#np').focus();
}
function submitNewPassword(){
  var p=$('#np').value,msg=$('#np-msg');
  if(p.length<8){msg.textContent='Passwords need at least 8 characters.';return}
  if(p!==$('#np2').value){msg.textContent='The two passwords don’t match.';return}
  SB.auth.updateUser({password:p}).then(function(r){
    if(r.error){msg.textContent=authError(r.error);return}
    closeDlg();toast('Password updated');
  });
}
function handleSession(session){
  var u=session?session.user:null;
  if(!BOOT&&(u&&u.id)===(USER&&USER.id))return;
  BOOT=false;USER=u;ME=null;
  if(!u){S=load();render();return}
  S=blank();render();
  SB.from('profiles').select('*').eq('id',u.id).maybeSingle().then(function(r){
    if(USER!==u)return;
    if(r.error)throw r.error;
    if(!r.data){openUsername();return}
    ME=r.data;
    return fetchUserData(ME).then(function(d){
      if(USER!==u)return;
      S=d;render();
      if(importable())toast('You have ratings saved in this browser. Import them from your profile.');
    });
  }).catch(function(e){console.error(e);toast('Couldn’t load your account. Reload the page to try again.')});
}
function initAuth(){
  var c=window.FULLTIME_CONFIG||{};
  if(!window.supabase||!c.supabaseUrl||!c.supabaseKey){BOOT=false;return}
  try{SB=window.supabase.createClient(c.supabaseUrl,c.supabaseKey)}
  catch(e){console.error(e);SB=null;BOOT=false;return}
  SB.auth.onAuthStateChange(function(event,session){
    // Defer: supabase-js warns against calling it from inside this callback.
    setTimeout(function(){handleSession(session)},0);
  });
}

window.addEventListener('hashchange',function(){NAVS++;route()});
initAuth();
route();
fetch('squads.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(d){SQUADS=d&&d.teams&&typeof d.teams==='object'?d:{teams:{}}})
  .catch(function(){SQUADS_ERR=true})
  .then(function(){if(V.tab==='players'&&!V.match&&!D)render()});
})();
</script>
