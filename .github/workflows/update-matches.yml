name: Update matches

on:
  schedule:
    - cron: '0 6 * * 5' # Fridays 06:00 UTC (11:30 IST), after each Tue-Thu matchday
  workflow_dispatch:
  push: # rerun when the importer itself changes
    branches: [main]
    paths:
      - scripts/update_matches.py
      - .github/workflows/update-matches.yml

permissions:
  contents: write
  pages: write

concurrency: update-matches

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch results, fixtures and squads
        id: update
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/update_matches.py

      - name: Commit and push
        id: commit
        run: |
          git add index.html CLAUDE.md squads.json 2>/dev/null || git add index.html CLAUDE.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ steps.update.outputs.message }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
